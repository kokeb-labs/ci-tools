<title id="journal-layout-title">Fault journal record and ring</title>
<desc id="journal-layout-desc">Layout of the 32-byte fault journal record in four rows of eight bytes, from the magic and version to the CRC-32, and a ring of eight slots in which the next append overwrites the oldest record.</desc>
