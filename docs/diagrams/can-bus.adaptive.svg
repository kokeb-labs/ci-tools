<svg xmlns="http://www.w3.org/2000/svg" width="640" height="664" viewBox="0 0 640 664" role="img" aria-labelledby="can-bus-title can-bus-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="can-bus-title">CAN bus with three nodes</title>
<desc id="can-bus-desc">A CAN bus on which an MCU and two devices share the CANH and CANL lines, with a terminating resistor at each end of the pair.</desc>
