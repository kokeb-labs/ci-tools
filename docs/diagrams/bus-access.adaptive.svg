<svg xmlns="http://www.w3.org/2000/svg" width="890" height="620" viewBox="0 0 890 620" role="img" aria-labelledby="bus-access-title bus-access-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="bus-access-title">A guarded bus access</title>
<desc id="bus-access-desc">Sequence of a guarded register read, in which the caller asks the handler, the handler takes the bus lock, calls the driver, and the driver returns the value through the port.</desc>
