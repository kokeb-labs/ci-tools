{#-
  Material 9.8.0 builds the version-banner scope with `new URL("{{ base_url }}")`. base_url is relative ("." or
  ".."), so the constructor throws "Invalid URL" on every page of a versioned site. The base is resolved against the
  page address, as Material's own `__md_scope` is.
-#}
<script>var el=document.querySelector("[data-md-component=outdated]"),base=new URL("{{ base_url }}",location),outdated=__md_get("__outdated",sessionStorage,base);!0===outdated&&el&&(el.hidden=!1)</script>
