# The kokeb theme: Material for MkDocs plus the Kokeb Labs templates (main.html, partials/) and assets (assets/kokeb/).
# A site selects it with `theme: {name: kokeb}`; everything here is a default the site's mkdocs.yml may override.
extends: material

language: en
logo: assets/kokeb/mark.svg
favicon: assets/kokeb/favicon.svg

# Fonts: Inter and JetBrains Mono from Google Fonts, loaded without blocking the first paint (main.html); the
# system font stack shows until they arrive. Material's own font loading is off for that reason.
font: false

icon:
  repo: fontawesome/brands/github
  admonition:
    note: octicons/info-16
    tip: octicons/light-bulb-16
    warning: octicons/alert-16
    danger: octicons/zap-16
    example: octicons/beaker-16
    quote: octicons/quote-16

palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-auto
      name: Follow the system theme

features:
  - navigation.tabs
  - navigation.sections
  - navigation.indexes
  - navigation.prune
  - navigation.top
  - navigation.footer
  - navigation.tracking
  - navigation.instant
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
  - content.action.edit
  - content.tabs.link
  - toc.follow
