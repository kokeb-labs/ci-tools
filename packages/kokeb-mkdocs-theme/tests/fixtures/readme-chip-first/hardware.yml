---
# The chip's hardware in one file: package, pins, the driver hook of each pin, the blocks inside, and reference
# circuits. `kokeb-docs figures` draws the pinout, the block diagram and one figure per circuit from it,
# `kokeb-docs gen` writes the pin table on docs/hardware.md, `kokeb-docs hardware --check` validates it and
# `kokeb-docs hardware --kicad-netlist OUT --circuit ID` exports a circuit for a schematic or PCB tool.
# Schema: docs/chip-diagrams.md in kokeb-labs/ci-tools.
#
# TEST FIXTURE (a copy of the template's file with the package data of schema 1.16): PLACEHOLDER: the XMPL100 is a fictional SPI temperature sensor and so is its datasheet. Replace every value with
# the real chip's, citing the datasheet section and printed page of each fact.
schema: 1
chip: XMPL100

# A driver repository lists its documents in docs/datasheets.yml and leaves this out.
documents:
  - id: ds
    name: Example Corp (fictional) XMPL100-DS A

refs:
  pinout: {doc: ds, section: "3 Pin configuration", page: 3}
  supply: {doc: ds, section: "5 Electrical characteristics", page: 5}
  spi: {doc: ds, section: "6.2 SPI interface", page: 8}
  alert: {doc: ds, section: "7.7 ALERT_HIGH and ALERT_LOW", page: 15}
  reset: {doc: ds, section: "8.3 Hardware reset", page: 18}
  blocks: {doc: ds, section: "2 Block diagram", page: 2}
  app: {doc: ds, section: "9 Application information", page: 20}
  outline: {doc: ds, section: "10.1 Package outline", page: 24}
  mech: {doc: ds, section: "5 Electrical characteristics, Table 4 Mechanical data", page: 5}
  order: {doc: ds, section: "11 Ordering information", page: 26}
  features: {doc: ds, section: "1 Features", page: 1}
  temp: {doc: ds, section: "7.6 TEMP_MSB, TEMP_LSB and TEMP_CRC", page: 14}
  modes: {doc: ds, section: "7.4 CTRL", page: 13}
  offset: {doc: ds, section: "7.8 OFFSET", page: 15}
  crc: {doc: ds, section: "7.9 CRC", page: 16}

package:
  type: SOIC-8
  pins: 8
  ref: pinout
  outline: {length_mm: 4.9, width_mm: 3.9, height_mm: 1.75, pitch_mm: 1.27, ref: outline, height_ref: mech}
  variants:
    - {id: dfn, type: DFN-8, pins: 8, size: "3.0 x 3.0 x 0.8 mm", ordering: "XMPL100D", note: "exposed pad to GND",
       ref: order}
    - {id: tssop, type: TSSOP-8, pins: 8, size: "3.0 x 4.4 x 1.2 mm", ordering: "XMPL100T", ref: order}

supply:
  - {name: VDD, min_v: 1.8, max_v: 3.6, ref: supply}

# The chip-first README (ci-tools docs/readme-chip-first.md): what the chip is and does, where it is used, how
# the driver covers it and what one SPI access carries. `kokeb-docs figures` draws chip-hero, chip-capabilities,
# chip-frame-spi and chip-wiring-typical from it, `kokeb-docs gen` the README's chip-summary, chip-uses and
# chip-coverage regions. PLACEHOLDER like the rest of this file: write the real chip's facts, each with its citation.
overview:
  # Completes "The XMPL100 is ...": what the chip is and what it does for the board, in one sentence, no full stop.
  summary: >-
    a digital temperature sensor that measures its own die from -40 °C to +125 °C in steps of 1/128 °C and pulls an
    alert line low when the temperature leaves a window you set
  category: Digital temperature sensor
  ref: features
  # Where the datasheet says the chip is used (its applications list); one short noun phrase each.
  applications:
    - Board and enclosure temperature monitoring
    - Thermal protection of power stages
    - Battery pack temperature
    - Data loggers
  # Two to six headline numbers, the ones a reader compares parts by.
  specs:
    - {value: "-40 to +125 °C", label: measurement range, ref: temp}
    - {value: "1/128 °C", label: resolution of the 16-bit result, ref: temp}
    - {value: "10 MHz", label: "SPI clock, mode 0 or 3", ref: spi}
    - {value: "1.8 to 3.6 V", label: supply, ref: supply}
  # The hero: the host and its bus, what the chip drives (left to right) and what it reads back.
  system:
    host: MCU
    bus: SPI
    drives:
      - {label: ALERT line, detail: "open drain, to an interrupt input", ref: alert}
    senses:
      - {label: Die temperature, ref: temp}

# Headers the capability names are checked against.
driver:
  api: [inc/xmpl100.hpp]
  registers: [inc/xmpl100_registers.hpp]

# One entry per function of the chip: the card in chip-capabilities and the row in the README's coverage table.
# icon: one of the names in kokeb_mkdocs_theme/hardware/icons.py; status: supported, guarded, partial, read-only or
# not-covered; api and registers are checked against the headers above.
capabilities:
  - {id: measure, title: Temperature, icon: temperature, status: supported, ref: temp, docs: api-guide.md,
     what: "Measures the die temperature as a 16-bit result, 1/128 °C per count",
     api: [ReadTemperatureC, ReadRawTemperature], registers: [TEMP_MSB, TEMP_LSB]}
  - {id: modes, title: Continuous and one-shot, icon: clock, status: supported, ref: modes, docs: api-guide.md,
     what: "Converts continuously at a chosen rate, or once on request to save power",
     api: [SetMode, TriggerOneShot, WaitDataReady, MeasureOnceC], registers: [CTRL, CONFIG]}
  - {id: alert, title: Alert window, icon: alert, status: supported, ref: alert, docs: hardware.md,
     what: "Pulls the open-drain ALERT pin low outside a high and a low threshold",
     api: [SetAlertThresholdsC, ReadStatus], registers: [ALERT_HIGH, ALERT_LOW, STATUS]}
  - {id: crc, title: Result CRC, icon: check, status: supported, ref: crc, docs: api-guide.md,
     what: "Protects each result with a CRC-8 on revision B silicon",
     api: [ReadTemperatureC], registers: [TEMP_CRC]}
  - {id: offset, title: Offset trim, icon: settings, status: supported, ref: offset, docs: api-guide.md,
     what: "Shifts every result by a signed offset, 1/16 °C per count",
     api: [ApplyConfig], registers: [OFFSET]}
  - {id: identity, title: Reset and identity, icon: tag, status: supported, ref: reset, docs: hardware.md,
     what: "Soft or hardware reset, then a chip ID and revision check before anything else",
     api: [EnsureInitialized, SoftReset, HardwareReset], registers: [CHIP_ID, REV_ID]}

# One bus access bit by bit: each row a kind of frame, the fields from the most significant bit down.
frames:
  - id: spi
    title: SPI register access
    description: One register per access; a burst continues with the next address.
    bits: 16
    ref: spi
    rows:
      - label: Write
        sub: "SDI, R/W = 0"
        fields:
          - {name: R/W, bits: 15, tone: amber}
          - {name: address, bits: [14, 8], tone: blue}
          - {name: data, bits: [7, 0], tone: green}
      - label: Read
        sub: "SDI, R/W = 1"
        fields:
          - {name: R/W, bits: 15, tone: amber}
          - {name: address, bits: [14, 8], tone: blue}
          - {name: any value, bits: [7, 0], tone: slate}
      - label: Reply
        sub: SDO
        fields:
          - {name: ignored, bits: [15, 8], tone: slate}
          - {name: register data, bits: [7, 0], tone: green}
    waveform:
      spi_mode: 0
      select: CS_N
      clock: SCLK
      lanes:
        - {name: SDI, row: Read}
        - {name: SDO, row: Reply}

# The port hooks a pin can map to (the names the driver's port headers declare).
hooks:
  - {id: transfer, call: "Transfer()", kind: spi}
  - {id: reset, call: "GpioSet(CtrlPin::Reset)", kind: gpio-out}

pins:
  - {number: 1, name: CS_N, type: bus, domain: VDD, function: "SPI chip select, active low", hook: transfer,
     ref: spi}
  - {number: 2, name: SDO, type: bus, domain: VDD, function: "SPI data out (MISO); high impedance while CS_N is high",
     hook: transfer, ref: spi}
  - {number: 3, name: ALERT, type: open-drain, domain: VDD,
     function: "Threshold alert, open drain; read STATUS when it fires", unused: Leave open, ref: alert}
  - {number: 4, name: GND, type: ground, domain: GND, function: Ground, ref: pinout}
  - {number: 5, name: SDI, type: bus, domain: VDD, function: "SPI data in (MOSI)", hook: transfer, ref: spi}
  - {number: 6, name: SCLK, type: bus, domain: VDD, function: "SPI clock, up to 10 MHz", hook: transfer, ref: spi}
  - {number: 7, name: RESET_N, type: digital-in, domain: VDD,
     function: "Hardware reset, active low, internal 100 kΩ pull-up", hook: reset, unused: Leave open, ref: reset}
  - {number: 8, name: VDD, type: power, domain: VDD, function: "Supply, 1.8 V to 3.6 V", ref: supply}

block_diagram:
  ref: blocks
  blocks:
    - {id: spi, label: SPI interface, detail: "mode 0 or 3, up to 10 MHz", at: [0, 0], tone: blue,
       pins: [CS_N, SCLK, SDI, SDO]}
    - {id: regs, label: Registers and CRC, detail: "CTRL, STATUS, TEMP, CRC-8", at: [1, 0]}
    - {id: adc, label: Temperature ADC, detail: "16-bit, t_CONV", at: [2, 0], tone: teal}
    - {id: alert, label: Alert comparator, detail: "ALERT_HIGH, ALERT_LOW", at: [1, 1], tone: amber,
       pins: [ALERT], side: right}
    - {id: por, label: Reset and power-on, detail: "POR, RESET_N, soft reset", at: [0, 1], tone: slate,
       pins: [RESET_N, VDD, GND]}
  links:
    - {from: spi, to: regs, label: frames, both: true}
    - {from: adc, to: regs, label: result}
    - {from: regs, to: alert, label: thresholds}
    - {from: por, to: regs, label: reset}

circuits:
  - id: typical
    title: Typical application
    description: >-
      The XMPL100 on an MCU's SPI bus, with RESET_N on a GPIO the driver drives through GpioSet() and ALERT on an
      interrupt input.
    ref: app
    parts:
      - {id: U1, kind: chip}
      - id: U2
        kind: mcu
        label: MCU
        pins:
          - {name: SCK, label: SPI SCK}
          - {name: MOSI, label: SPI MOSI}
          - {name: MISO, label: SPI MISO}
          - {name: CS, label: GPIO / CS}
          - {name: RST, label: GPIO}
          - {name: IRQ, label: GPIO (IRQ)}
          - VDD
          - GND
      - {id: C1, kind: capacitor, value: 100 nF, ref: supply}
      - {id: R1, kind: resistor, value: 10 kΩ, ref: alert}
    nets:
      - {name: "+3V3", kind: supply, nodes: [U1.VDD, C1.1, R1.1, U2.VDD]}
      - {name: GND, kind: ground, nodes: [U1.GND, C1.2, U2.GND]}
      - {name: SCLK, nodes: [U1.SCLK, U2.SCK]}
      - {name: SDI, nodes: [U1.SDI, U2.MOSI]}
      - {name: SDO, nodes: [U1.SDO, U2.MISO]}
      - {name: CS_N, nodes: [U1.CS_N, U2.CS]}
      - {name: RESET_N, nodes: [U1.RESET_N, U2.RST]}
      - {name: ALERT, nodes: [U1.ALERT, R1.2, U2.IRQ]}
