  - {more: true, label: "…"}
  - {label: XMPL100 N, detail: last}
chain: {in: SDI, out: SDO, host_out: MOSI, host_in: MISO}
shared: [SCK, CSN]
facts:
  - {text: "Each device delays the data by 40 clocks; send 40 bits per device in one CSN low phase", ref: signals}
  - {text: "Each device takes the last 40 bits it holds when CSN rises", ref: signals}
