---
kind: topology
id: spi-chain
title: SPI daisy chain
kicker: Several devices
alt: >-
  Daisy chain of XMPL100 devices on one SPI bus: the MCU feeds SDI of the first, each SDO feeds the next SDI and the
  last SDO returns to the MCU, with SCK and CSN shared.
reads: >-
  The MCU on the left drives MOSI into SDI of XMPL100 1; its SDO feeds the next device and so on to XMPL100 N, whose
  SDO returns to MISO. SCK and CSN are rails every device shares, so one select frames the datagrams of every driver.
style: chain
