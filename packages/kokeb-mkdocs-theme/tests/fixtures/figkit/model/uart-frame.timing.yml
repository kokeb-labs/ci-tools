kind: timing
id: uart-frame
title: UART character
kicker: On the bus
alt: >-
  One UART character on the TX line: the start bit, eight data bits sent least significant bit first and the stop
  bit, at the bit time the datasheet gives.
reads: >-
  The lane is TX, left to right in time. The line idles high, the start bit pulls it low for one bit time, the data
  bits D0 to D7 follow and the stop bit returns it high.
bus: uart
refs:
