.fk-f-h4-tint{fill:var(--fk-h4-tint)}.fk-s-h4-tint{stroke:var(--fk-h4-tint)}
.fk-f-hair{fill:var(--fk-hair)}.fk-s-hair{stroke:var(--fk-hair)}
.fk-f-ink{fill:var(--fk-ink)}.fk-s-ink{stroke:var(--fk-ink)}
.fk-f-line{fill:var(--fk-line)}.fk-s-line{stroke:var(--fk-line)}
@media (forced-colors:active){.fk text{fill:CanvasText}.fk rect,.fk circle{fill:Canvas;stroke:CanvasText}.fk path{stroke:CanvasText}.fk marker path{fill:CanvasText;stroke:none}}
</style>
<rect x="0.5" y="0.5" width="453" height="358" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">EXAMPLE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">Channels per port</text>
<rect x="32" y="93.3" width="390" height="1" class="fk-f-hair"/>
<rect x="161" y="154.3" width="122" height="54" rx="10" stroke-width="1.4" class="fk-f-h2-tint fk-s-line"/>
<rect x="289" y="154.3" width="122" height="54" rx="10" stroke-width="1.4" class="fk-f-h4-tint fk-s-line"/>
<rect x="161" y="214.3" width="122" height="54" rx="10" stroke-width="1.4" class="fk-f-h1-tint fk-s-line"/>
<rect x="289" y="214.3" width="122" height="54" rx="10" stroke-width="1.4" class="fk-f-h3-tint fk-s-line"/>
<rect x="161" y="274.3" width="122" height="54" rx="10" stroke-width="1.4" class="fk-f-h0-tint fk-s-line"/>
<rect x="289" y="274.3" width="122" height="54" rx="10" stroke-width="1.4" class="fk-f-h1-tint fk-s-line"/>
<text x="222" y="139.3" font-size="13" font-weight="700" text-anchor="middle" class="fk-f-ink">Port A</text>
<text x="350" y="139.3" font-size="13" font-weight="700" text-anchor="middle" class="fk-f-ink">Port B</text>
<text x="44" y="186.3" font-size="13" font-weight="700" class="fk-f-ink">ADC</text>
<text x="222" y="186.3" font-size="13" font-weight="600" text-anchor="middle" class="fk-f-h2-text">8 ch</text>
<text x="350" y="186.3" font-size="13" font-weight="600" text-anchor="middle" class="fk-f-h4-text">16 ch</text>
<text x="44" y="246.3" font-size="13" font-weight="700" class="fk-f-ink">PWM</text>
<text x="222" y="246.3" font-size="13" font-weight="600" text-anchor="middle" class="fk-f-h1-text">4 ch</text>
<text x="350" y="246.3" font-size="13" font-weight="600" text-anchor="middle" class="fk-f-h3-text">12 ch</text>
<text x="44" y="306.3" font-size="13" font-weight="700" class="fk-f-ink">Timer</text>
<text x="222" y="306.3" font-size="13" font-weight="600" text-anchor="middle" class="fk-f-h0-text">1 ch</text>
<text x="350" y="306.3" font-size="13" font-weight="600" text-anchor="middle" class="fk-f-h1-text">6 ch</text>
</svg>
