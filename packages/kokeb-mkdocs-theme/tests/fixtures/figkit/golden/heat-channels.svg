<svg xmlns="http://www.w3.org/2000/svg" width="454" height="359" viewBox="0 0 454 359" role="img" aria-labelledby="heat-channels-title heat-channels-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="heat-channels-title">Channels per port</title>
<desc id="heat-channels-desc">Heat map of the number of channels each port offers for the ADC, PWM and timer peripherals, darker cells meaning more channels.</desc>
<rect x="0.5" y="0.5" width="453" height="358" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">EXAMPLE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Channels per port</text>
<rect x="32" y="93.3" width="390" height="1" fill="#E2E7EE"/>
<rect x="161" y="154.3" width="122" height="54" rx="10" fill="#9CC0F5" stroke="#738093" stroke-width="1.4"/>
<rect x="289" y="154.3" width="122" height="54" rx="10" fill="#1E429F" stroke="#738093" stroke-width="1.4"/>
<rect x="161" y="214.3" width="122" height="54" rx="10" fill="#CFE0FB" stroke="#738093" stroke-width="1.4"/>
<rect x="289" y="214.3" width="122" height="54" rx="10" fill="#3F73D8" stroke="#738093" stroke-width="1.4"/>
<rect x="161" y="274.3" width="122" height="54" rx="10" fill="#EAF2FF" stroke="#738093" stroke-width="1.4"/>
<rect x="289" y="274.3" width="122" height="54" rx="10" fill="#CFE0FB" stroke="#738093" stroke-width="1.4"/>
<text x="222" y="139.3" font-size="13" font-weight="700" text-anchor="middle" fill="#0E1726">Port A</text>
<text x="350" y="139.3" font-size="13" font-weight="700" text-anchor="middle" fill="#0E1726">Port B</text>
<text x="44" y="186.3" font-size="13" font-weight="700" fill="#0E1726">ADC</text>
<text x="222" y="186.3" font-size="13" font-weight="600" text-anchor="middle" fill="#0E1726">8 ch</text>
<text x="350" y="186.3" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">16 ch</text>
<text x="44" y="246.3" font-size="13" font-weight="700" fill="#0E1726">PWM</text>
<text x="222" y="246.3" font-size="13" font-weight="600" text-anchor="middle" fill="#0E1726">4 ch</text>
<text x="350" y="246.3" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">12 ch</text>
<text x="44" y="306.3" font-size="13" font-weight="700" fill="#0E1726">Timer</text>
<text x="222" y="306.3" font-size="13" font-weight="600" text-anchor="middle" fill="#0E1726">1 ch</text>
<text x="350" y="306.3" font-size="13" font-weight="600" text-anchor="middle" fill="#0E1726">6 ch</text>
</svg>
