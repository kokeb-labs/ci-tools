---
guideline: Rule 18.5.1
notes: >-
  Not applicable (no exceptions); -fno-exceptions makes the construct a hard error. Seeded with a noexcept function that throws. With -fno-exceptions each compiler rejects the first exception construct of a function, not the seeded construct itself (Clang at try or throw, GCC at the first handler or the throw), so the markers name the compiler that reports each line.
gcc: {error: "exception handling disabled"}
clang: {error: "cannot use '(throw|try)' with exceptions disabled"}
compiles: false
seeded:
  - a noexcept function that throws directly
  - a noexcept function whose try block lets an exception out through a rethrow
near_misses:
  - errors returned as values (an enum status)
  - identifiers and strings that only contain the words throw, try and catch (throttle, retry, catch_up)
