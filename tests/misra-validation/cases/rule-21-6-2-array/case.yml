---
guideline: Rule 21.6.2
notes: CodeQL only - the array forms new[] and delete[] managed by hand.
codeql:
  queries: [cpp/misra/dynamic-memory-managed-manually]
other_findings:
  - query: cpp/misra/dynamic-memory-should-not-be-used
    why: "true positive of Rule 21.6.1 (advisory): the compliant form still allocates; this guideline is about
      who owns the allocation."
known_misses:
  - query: cpp/misra/dynamic-memory-managed-manually
    kind: false-negative
    why: >-
      An array new-expression whose result is released with delete[] is not reported. The query reports calls of
      allocation and deallocation functions, and the database records the call of operator new[] or operator
      delete[] only when the translation unit includes <new> (directly or through <memory>); this file does not. The
      array form is reported where <memory> is included (rule-23-11-1/bad_array.cpp).
seeded:
  - "new[] of an int array released with delete[] by hand"
near_misses:
  - "std::make_unique of an array owned by unique_ptr<T[]>"
