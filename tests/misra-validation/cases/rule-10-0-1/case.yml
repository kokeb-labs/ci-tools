  - a pointer and an object in one local declaration, two namespace-scope objects in one declaration (bad_pointer.cpp)
near_misses:
  - one declarator per declaration (ok.hpp)
  - a for-init with a single declarator (ok_near.hpp)
  - several parameters in one function declaration (not a declaration list) (ok_near.hpp)
