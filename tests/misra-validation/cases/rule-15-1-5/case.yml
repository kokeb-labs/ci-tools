---
guideline: Rule 15.1.5
codeql:
  queries: [cpp/misra/initializer-list-constructor-is-the-only-constructor]
other_findings:
  - query: cpp/misra/implicit-declaration-of-copy-constructor
    why: >-
      misfire: the pack's Rule 4.1.2 query counts an explicitly defaulted copy member as implicitly declared, so a
      class that declares its special members (= default) is reported as using the deprecated implicit copy; an
      explicitly defaulted member is user-declared and not deprecated.
  - query: cpp/misra/exception-unfriendly-function-must-be-noexcept
    why: >-
      misfire: the move constructor and the move assignment are declared noexcept; the database is built with
      -fno-exceptions (the org flags), under which the extractor does not record the exception specification, so the
      Rule 18.4.1 query sees them as potentially throwing (the false positive of rule-18-4-1-no-exceptions).
notes: >-
  The query reports the other constructor (the one that brace initialisation would bypass), so the markers are on
  those lines.
known_misses:
  - query: cpp/misra/initializer-list-constructor-is-the-only-constructor
    kind: false-negative
    why: >-
      A default constructor next to an initializer_list constructor (bad_default.cpp) is not reported; the guideline
      permits only copy and move constructors besides it.
seeded:
  - initializer_list constructor next to a two-argument constructor
  - initializer_list constructor next to a single-argument size constructor
  - initializer_list constructor next to a default constructor (bad_default.cpp)
near_misses:
  - initializer_list constructor as the only constructor besides the special members
  - initializer_list constructor with explicitly defaulted copy and move constructors
