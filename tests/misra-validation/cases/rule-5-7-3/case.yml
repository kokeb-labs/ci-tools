---
guideline: Rule 5.7.3
gcc: {flag: comment}
clang: {flag: comment}
codeql:
  queries: [cpp/misra/line-splicing-used-in-comments]
seeded:
  - "a // comment ending in a backslash that swallows a function"
  - "the same splice hiding a statement in a function body"
near_misses:
  - "a plain // comment"
  - "backslashes in the middle of a // comment"
  - "a // comment ending with a slash"
notes: >-
  The marker sits on the spliced line after each comment, because a marker cannot end a line that must end with
  the backslash. The compilers and CodeQL report the comment on the line where it starts (the line above the
  marker), so this case needs the validator to accept a marker on a line spliced into the preceding comment.
