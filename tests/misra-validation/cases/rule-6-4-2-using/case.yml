---
guideline: Rule 6.4.2
notes: >-
  The using-declaration form of Rule 6.4.2: a using-declaration in a derived class does not introduce a base
  overload whose signature the derived class itself declares, so that overload is concealed. This case used to claim
  cpp/misra/definition-shall-be-considered-for-unqualified-lookup with a namespace-scope using-declaration before a
  later overload; that query only looks at namespace-scope functions (the old MISRA 2008 7-3-5 / AUTOSAR A7-3-1
  check), which is not a Rule 6.4.2 form, so the claim was dropped. The non-virtual hiding query is claimed instead.
codeql:
  queries: [cpp/misra/inherited-non-overridable-member-function]
known_misses:
  - query: cpp/misra/inherited-non-overridable-member-function
    kind: false-negative
    why: >-
      Derived::convert(std::int32_t) next to using Base::convert (bad.cpp) is not reported: a using-declaration does
      not introduce a base overload whose signature the derived class declares itself, so
      Base::convert(std::int32_t) stays concealed, but the query treats the using-declaration as bringing in the
      whole base overload set.
other_findings:
  - query: cpp/misra/no-c-style-or-functional-casts
    why: >-
      misfire: the Rule 8.2.2 query reports std::int64_t{5}, std::int32_t{1}, std::int16_t{3} and std::int32_t{4} as
      C-style casts; they are functional notation with curly braces, which the guideline's amplification excludes.
  - query: cpp/misra/signed-integer-overflow
    why: >-
      misfire: the Rule 4.1.3 query reports the sum of two convert (or scale) results in use() as a possible
      overflow; with the constant arguments the operands are 5 and 1 (6 and 4), so the sum cannot overflow; the
      query does not follow the calls.
seeded:
  - "a derived redeclaration of a base overload's signature next to a using-declaration of the base overload set"
near_misses:
  - "a using-declaration of the base overloads plus a derived overload with a new signature"
  - "a using-declaration of a single base function plus a derived overload"
