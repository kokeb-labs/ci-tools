---
guideline: Rule 4.1.1
notes: >-
  Records a false positive of the pack on __has_include. The main case rule-4-1-1 proves detection.
  rule-19-1-3-has-include holds the same compliant header for Rule 19.1.3.
codeql:
  queries: [cpp/misra/compiler-language-extensions-used]
known_misses:
  - query: cpp/misra/compiler-language-extensions-used
    kind: false-positive
    why: >-
      #ifdef __has_include is reported as a compiler language extension. __has_include is part of standard C++
      since C++17, and the standard lets #ifdef and defined test it as if it were a macro name; the query
      treats the name as a vendor extension.
other_findings:
  - query: cpp/misra/identifiers-used-in-the-controlling-expression-of
    why: >-
      misfire: the Rule 19.1.3 query reports the operand of __has_include as undefined identifiers; the
      operand is a header name, not identifiers to evaluate (recorded in rule-19-1-3-has-include).
seeded:
  - "a GNU function attribute (__attribute__((noinline)))"
near_misses:
  - "#ifdef __has_include, then #if __has_include(\"header\") (ok.hpp)"
