---
guideline: Rule 15.0.2
codeql:
  queries: [cpp/misra/invalid-signature-for-special-member-function]
other_findings:
  - query: cpp/misra/implicit-declaration-of-copy-constructor
    why: >-
      misfire: the pack's Rule 4.1.2 query counts an explicitly defaulted copy member as implicitly declared, so a
      class that declares all five special members (= default) with a user-declared destructor is reported as using
      the deprecated implicit copy; an explicitly defaulted member is user-declared and not deprecated.
  - query: cpp/misra/exception-unfriendly-function-must-be-noexcept
    why: >-
      misfire: the move constructor and the move assignment are declared noexcept; the database is built with
      -fno-exceptions (the org flags), under which the extractor does not record the exception specification, so the
      Rule 18.4.1 query sees them as potentially throwing (the false positive of rule-18-4-1-no-exceptions).
seeded:
  - copy assignment taking a non-const reference and returning by value
  - copy constructor taking a non-const reference
near_misses:
  - conventional ref-qualified copy and move assignments
  - an assignment operator from another type, which is not a special member
