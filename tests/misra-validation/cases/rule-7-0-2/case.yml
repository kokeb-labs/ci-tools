---
guideline: Rule 7.0.2
codeql:
  queries: [cpp/misra/no-implicit-bool-conversion]
other_findings:
  - query: cpp/misra/no-pointer-to-integral-cast
    why: >-
      misfire: the Rule 8.2.7 query reports the pointer used as the if condition (if (p)) as a cast to bool; no cast
      is written, the contextual conversion of a pointer is not a cast, and Rule 7.0.2 permits it by exception.
seeded:
  - "an integer used directly as an if condition"
  - "a pointer converted to a bool object (a converting transfer, not a condition)"
  - "an integer as a while condition"
  - "an integer as the condition of the conditional operator"
  - "logical not applied to an integer"
  - "integers as operands of &&"
  - "an if condition that declares an integer (bad_decl.cpp)"
near_misses:
  - "comparisons (!= 0, != nullptr) as conditions"
  - "a bool variable as a condition"
  - "a loop condition written as a comparison with zero"
  - "a pointer used directly as an if condition (allowed by exception)"
