---
guideline: Rule 25.5.2
notes: The clang-tidy claim bans every call of these functions, so the ok file calls none of them.
clang-tidy:
  check: bugprone-unsafe-functions
  options:
    bugprone-unsafe-functions.CustomFunctions: "^::(std::)?(localeconv|getenv|setlocale|strerror)$,,banned by the MISRA C++ profile"
codeql:
  queries: [cpp/misra/pointers-returned-by-locale-functions-must-be-used-as-const]
seeded:
  - "the result of getenv and of strerror written through *p"
  - "the result of setlocale written through *p"
near_misses:
  - "configuration passed as a parameter"
  - "a function of our own named getenv whose buffer we own"
