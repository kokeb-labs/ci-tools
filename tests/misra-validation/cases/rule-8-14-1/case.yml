---
guideline: Rule 8.14.1
codeql:
  queries: [cpp/misra/short-circuited-persistent-side-effect]
other_findings:
  - query: cpp/misra/unsigned-operation-with-constant-operands-wraps
    why: >-
      misfire: Rule 8.20.1 is about unsigned arithmetic whose operands are constant expressions; the pack also
      reports the run-time increment `++port.reads`, whose operands are not constant, whenever its range analysis cannot bound them
known_misses:
  - query: cpp/misra/short-circuited-persistent-side-effect
    kind: false-negative
    why: >-
      A read of a volatile object in the right operand of && (reg == 1U, bad_edge.cpp) is not reported: the query
      does not count a volatile access as a persistent side effect, although the guideline does. Increments,
      assignments and calls with persistent side effects in the right operand are reported.
seeded:
  - "an increment of a persistent object in the right operand of &&"
  - "an assignment to a persistent object in the right operand of ||"
  - "a call with a persistent side effect in the right operand of &&"
  - "a volatile read in the right operand of &&"
near_misses:
  - "a side effect in the left operand"
  - "a pure function call in the right operand"
  - "the side effect moved to its own statement"
