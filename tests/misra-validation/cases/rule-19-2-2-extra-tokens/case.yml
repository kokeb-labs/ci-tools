guideline: Rule 19.2.2
notes: Tokens after the header name; a default-on warning (Clang names -Wextra-tokens), an error with -Werror.
gcc: {message: "extra tokens at end of '#include' directive \\[-Werror\\]"}
clang: {flag: extra-tokens}
codeql:
  queries: [cpp/misra/invalid-include-directive]
known_misses:
  - query: cpp/misra/invalid-include-directive
    why: >-
      The query checks only the header-name part of the directive, so tokens after the name are not reported; any
      other malformed form is a compile error (rule-19-2-2). The compilers decide this one with -Werror.
