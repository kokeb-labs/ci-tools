guideline: Rule 12.2.2
notes: >-
  The query takes the compiler from the extractor's --mimic argument and matches it against "%gcc", "%g++", "%clang"
  and "%clang++". A versioned or generic name (g++-14, clang++-18, c++) is an unsupported compiler, and then only
  explicitly signed or unsigned int and bool are accepted: a bit-field of std::uint8_t is reported although it is an
  unsigned integer type (a misfire against our reading of the guideline). Under a plain g++ or clang++ name the query
  accepts every integral and enumeration type and so reports nothing, the seeded int included. The self-CI builds
  with g++-14, the strict mode; this ok file uses std::uint32_t (unsigned int), which passes in both modes.
codeql:
  queries: [cpp/misra/bit-field-shall-have-an-appropriate-type]
other_findings:
  - {query: cpp/misra/bit-fields-should-not-be-declared-misra-cpp, why: "true positive of Rule 12.2.1: the case needs a bit-field to exist"}
# Also seen: a bit-field of std::int32_t (int) is reported in the strict mode, because plain int is not
# "explicitly signed"; our matrix allows only unsigned types and bool, so that report agrees with our profile.
