    kind: false-negative
    why: >-
      The new-expressions new std::int32_t{0} (bad.cpp) and new std::uint8_t[n] (bad_array_new.cpp) are not
      reported. The query reports calls of allocation functions, and the database records the call of operator new
      for a new-expression only when the translation unit includes <new> (directly or through <memory>, as in
      rule-23-11-1, where both forms are reported); these files include <cstdlib> only. malloc, realloc, calloc and
      std::vector are reported.
