---
guideline: Rule 19.0.2
notes: >-
  cppcoreguidelines-macro-usage also reports object-like macros that define a constant ("macro 'X' used to declare
  a constant"), which Rule 19.0.2 does not cover; the claim counts only its function-like and variadic diagnostics,
  and ok_constant.hpp holds such a constant macro. The check classifies a function-like macro with an empty
  parameter list that expands to a constant (KV_NOW() 0U) as a constant macro, so that form is marked for CodeQL
  only. ok_stringize.hpp holds a macro that uses #, compliant by the guideline's exception.
clang-tidy: {check: cppcoreguidelines-macro-usage, message: "^(function-like|variadic) macro"}
codeql:
  queries: [cpp/misra/function-like-macros-defined]
other_findings:
  - query: cpp/misra/non-explicit-conversion-member
    why: >-
      misfire: the pack's Rule 15.1.3 query reports the conversion-to-function-pointer operator the compiler gives
      a capture-less lambda's closure type; nobody declared it and it cannot be marked explicit.
  - query: cpp/misra/unsigned-operation-with-constant-operands-wraps
    why: >-
      misfire: the pack's Rule 8.20.1 query reports unsigned arithmetic on run-time operands; the guideline covers
      operations whose operands are constant expressions.
  - {query: cpp/misra/and-preprocessor-operators-should-not-be-used, why: "true positive of Rule 19.3.1: the near miss needs #"}
seeded:
  - function-like macro with one parameter
  - function-like macro with no parameters (CodeQL only; clang-tidy calls it a constant macro)
  - variadic function-like macro
near_misses:
  - constexpr function replacing the macro
  - constexpr lambda with a macro-like purpose
  - an object-like macro defining a constant (ok_constant.hpp)
  - a function-like macro using #, permitted by the exception (ok_stringize.hpp)
