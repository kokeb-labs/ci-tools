---
guideline: Rule 18.3.1
notes: >-
  Not applicable (no exceptions); -fno-exceptions makes the construct a hard error. Seeded with main without a catch-all handler, and with a catch-all handler that rethrows. With -fno-exceptions each compiler rejects the first exception construct of a function, not the seeded construct itself (Clang at try or throw, GCC at the first handler or the throw), so the markers name the compiler that reports each line.
gcc: {error: "exception handling disabled"}
clang: {error: "cannot use '(throw|try)' with exceptions disabled"}
compiles: false
seeded:
  - main with a try block that catches one type only
  - main whose only handler is catch (...) and rethrows, so every exception escapes main
near_misses:
  - errors returned as values (an enum status)
  - identifiers and strings that only contain the words throw, try and catch (throttle, retry, catch_up)
