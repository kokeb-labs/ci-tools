# Anomaly log of the MISRA toolchain: every known false negative and false positive found by the tool-validation
# suite, with its disposition. validate.py record fails when this log and the cases disagree (an anomaly a case
# records that is not here, or an entry no case records any more). Ids are never reused.
---
anomalies:
  - id: AN-001
    tool: codeql
    rule_id: cpp/misra/cast-removes-const-or-volatile-from-pointer-or-reference
    kind: false-negative
    case: tests/misra-validation/cases/rule-8-2-3-reference
    description: 'a cast of a volatile (or const) object to a non-volatile reference is not reported: the query
      looks for the qualifier below a pointer or reference type, but the operand of the cast is the object itself'
    disposition: Accepted as a limitation of the pinned pack. The requirement is recorded as an anomaly, not as
      passing; clang-tidy cppcoreguidelines-pro-type-const-cast reports every const_cast (validated, TV-TIDY-RULE-8-2-3-01);
      the guideline stays decided by clang-tidy.
    found: 2026-11-08 (pack 2.62.0, CLI 2.21.4)
  - id: AN-002
    tool: codeql
    rule_id: cpp/misra/global-unsized-operator-delete-shall-be-defined
    kind: false-negative
    case: tests/misra-validation/cases/rule-21-6-4-sized-only
    description: 'never reports: isSizeDelete() compares getParameter(1).getType().getUnderlyingType() with Size_t,
      a type named size_t; getUnderlyingType() strips the typedef, so no replacement is ever recognised as the sized
      form.'
    disposition: Accepted as a limitation of the pinned pack. The requirement is recorded as an anomaly, not as
      passing; Drivers never replace global operator delete (no heap, KB-CPP-003; Rule 21.6.1 query validated);
      review checklist item R-21.6.4.
    found: 2026-11-08 (pack 2.62.0, CLI 2.21.4)
