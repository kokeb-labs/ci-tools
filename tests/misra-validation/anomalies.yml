    description: The query checks only the header-name part of the directive, so tokens after the name are not reported;
      any other malformed form is a compile error (rule-19-2-2). The compilers decide this one with -Werror.
    disposition: Accepted as a limitation of the pinned pack. The requirement is recorded as an anomaly, not as
