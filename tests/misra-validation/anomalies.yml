limitations:
  - The pack is validated by its authors for C++14/17 with gcc 8.4, clang 10 and qcc 8.3 only; our C++20 code and
    GCC 13/14, Clang 18 and Arm GNU 14.3 are outside that scope. This suite is the evidence for our configuration
    (MD-CPP-001 covers C++20).
  - 'A passing requirement shows the tool reports every seeded form and stays silent on every compliant form in
    the suite. For an undecidable guideline it never shows absence of violations: those keep their review step (MISRA
    Compliance:2020 section 3.5).'
  - 'Results depend on the compiler identity the extractor sees: the suite and ru-misra build CodeQL databases with
    g++ (host) and arm-none-eabi-g++ (Cortex-M) only. Another compiler is outside the validated configuration.'
  - Only the configurations ru-misra analyses (host and cortex-m4f) are validated. Code compiled only for ESP-IDF
    (Xtensa) is not analysed by ru-misra yet; it stays under review and the commercial checker.
  - Compiler-decided guidelines hold only when the build uses the org flags; ru-misra checks every translation unit
    for them and fails at the safety level when one is missing.
  - Dir 0.3.2, Rule 5.13.7 and Rule 19.0.1 have no query in the pack; 5.13.7 and 19.0.1 are left to the compilers
    by the pack authors, and are not claimed by any tool in the matrix.
  - The audit queries of the pack (3) are not in the default suite and are not validated; they are not used.
