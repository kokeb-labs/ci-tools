    tool: codeql
    rule_id: cpp/misra/invalid-assignment-to-errno
    kind: false-negative
    case: tests/misra-validation/cases/rule-22-4-1
    description: isErrno() only matches a variable named errno or __errno; glibc defines errno as a macro over a
      call (*__errno_location()), the macOS SDK over (*__error()), so no assignment to errno is ever reported there.
    disposition: Accepted as a limitation of the pinned pack. The requirement is recorded as an anomaly, not as
      passing; errno is not used by our code; review checklist item R-22.4.1.
    found: 2026-11-08 (pack 2.62.0, CLI 2.21.4)
