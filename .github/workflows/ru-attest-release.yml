---
# Signed build provenance for a published release: downloads the release's files, checks them against its
# SHA256SUMS, and creates a GitHub artifact attestation (SLSA build provenance, signed through Sigstore) for every
# file SHA256SUMS lists. A separate workflow, run after ru-release or ru-release-firmware (or the deprecated
# ru-release-with-artifacts), because it needs id-token: write and attestations: write, which a caller of those
# does not grant. Needs a public repository (or GitHub Enterprise Cloud). Guide: docs/ru-attest-release.md.
name: 🔏 [RU] Attest Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag of the published release to attest (defaults to github.ref_name)'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  attest:
    name: Attest release files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read       # download the release files
      id-token: write      # sign the attestation through Sigstore
      attestations: write  # store the attestation on the repository
    steps:
      - name: Download the release files and check them against SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          gh release download "$TAG" -R "$REPO"
          if [ ! -f SHA256SUMS ]; then
            echo "::error::release ${TAG} has no SHA256SUMS; publish it with ru-release or ru-release-firmware (ru-release-with-artifacts 1.7.0 or later also works)"
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Attest every file in SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
