---
# Host quality gates for a CMake C/C++ project, as the Kokeb Labs handbook defines them (ADR-0020):
#   complexity  lizard (modified cyclomatic complexity, function length, parameters) over the library sources
#   coverage    GCC --coverage build, ctest, gcovr over the library sources: lines, branches and, at the safety
#               level, MC/DC (GCC condition coverage); floors per level
#   sanitizers  clang build with AddressSanitizer and UndefinedBehaviorSanitizer, ctest
#   fuzz        libFuzzer (clang, ASan, UBSan) on every fuzz_* target, from the committed seeds plus a cached
#               corpus; seconds per target by level (60, 120, 600). Runs when fuzz_cmake_args is set.
# Complexity, coverage and sanitizers run as steps of one job (separate_jobs: true gives one job each); fuzzing is
# its own job. Each check fails on its limits when `enforce` is true, and a failing check does not stop the others.
# The limits default to the level's; any can be overridden.
# Python tools are installed from pinned versions with their SHA-256 hashes.
name: 🧮 [RU] Host quality gates

on:
  workflow_call:
    inputs:
      level:
        description: "Assurance level: standard, high or safety. Sets the default limits (ADR-0020)."
        type: string
        required: false
        default: "high"
      source_dir:
        description: "CMake source directory, relative to the repository root"
        type: string
        required: false
        default: "."
      cmake_args:
        description: "Extra CMake configure arguments, e.g. -DMYCHIP_BUILD_TESTS=ON"
        type: string
        required: false
        default: ""
      ctest_args:
        description: "Extra ctest arguments"
        type: string
        required: false
        default: ""
      library_paths:
        description: >-
          Space-separated paths of library code, relative to the repository root. Complexity is measured on them and
          coverage counts only them; tests and examples are left out.
        type: string
        required: false
        default: "inc src"
      run_complexity:
        description: "Run the complexity job"
        type: boolean
        required: false
        default: true
      run_coverage:
        description: "Run the coverage job"
        type: boolean
        required: false
        default: true
      run_sanitizers:
        description: "Run the sanitizer job"
        type: boolean
        required: false
        default: true
      fuzz_cmake_args:
        description: >-
          CMake arguments that turn the libFuzzer targets on, e.g. -DMYCHIP_BUILD_FUZZERS=ON. Empty: no fuzz job.
          Every executable named fuzz_<name> in the build is fuzzed, seeded from <source_dir>/tests/fuzz/corpus/fuzz_<name>/.
        type: string
        required: false
        default: ""
      fuzz_seconds:
        description: "Seconds of fuzzing per target. Empty: the level's (60, 120, 600)."
        type: string
        required: false
        default: ""
      max_ccn:
        description: "Maximum modified cyclomatic complexity per function. Empty: the level's (15, 15, 10)."
        type: string
        required: false
        default: ""
      max_length:
        description: "Maximum lines of code per function. Empty: the level's (80, 60, 60)."
        type: string
        required: false
        default: ""
      max_params:
        description: "Maximum parameters per function. Empty: the level's (7, 6, 6)."
        type: string
        required: false
        default: ""
      min_line:
        description: "Minimum line coverage, percent. Empty: the level's (0 = report only, 85, 100)."
        type: string
        required: false
        default: ""
      min_branch:
        description: "Minimum branch coverage, percent. Empty: the level's (0 = report only, 75, 100)."
        type: string
        required: false
        default: ""
      min_condition:
        description: "Minimum MC/DC (GCC condition) coverage, percent. Empty: the level's (off, report, 100)."
        type: string
        required: false
        default: ""
      enforce:
        description: "Fail a job when a limit is exceeded. False reports only (the counts are in the outputs)."
        type: boolean
        required: false
        default: true
      artifact_name:
        description: "Name of the uploaded reports artifact"
        type: string
        required: false
        default: "host-quality-reports"
      separate_jobs:
        description: >-
          Run complexity, coverage and sanitizers each in its own job (the behaviour before 1.11.0). False (default)
          runs them as steps of one job, with the same limits, failures, summaries and artifacts: a private repository
          is billed one rounded-up job instead of four. Fuzzing is always its own job.
        type: boolean
        required: false
        default: false
    outputs:
      complexity_findings:
        description: "Number of functions over a complexity, length or parameter limit"
        value: ${{ jobs.gates.outputs.findings || jobs.complexity.outputs.findings }}
      line_coverage:
        description: "Line coverage of the library code, percent"
        value: ${{ jobs.gates.outputs.line || jobs.coverage.outputs.line }}
      branch_coverage:
        description: "Branch coverage of the library code, percent"
        value: ${{ jobs.gates.outputs.branch || jobs.coverage.outputs.branch }}
      condition_coverage:
        description: "MC/DC (condition) coverage of the library code, percent; empty when not measured"
        value: ${{ jobs.gates.outputs.condition || jobs.coverage.outputs.condition }}

permissions: {}

jobs:
  # Default: complexity, coverage and sanitizers as steps of this one job. Each check still runs when another one
  # failed, each fails the job on its own limits, and each uploads its own report artifact, as the separate jobs do.
  gates:
    name: complexity, coverage, sanitizers
    if: ${{ !inputs.separate_jobs }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.lizard.outputs.findings }}
      line: ${{ steps.gcovr.outputs.line }}
      branch: ${{ steps.gcovr.outputs.branch }}
      condition: ${{ steps.gcovr.outputs.condition }}
    steps:
      - &limits
        name: Resolve the limits (ADR-0020 defaults, then overrides)
        id: l
        env:
          LEVEL: ${{ inputs.level }}
          CCN: ${{ inputs.max_ccn }}
          LENGTH: ${{ inputs.max_length }}
          PARAMS: ${{ inputs.max_params }}
          LINE: ${{ inputs.min_line }}
          BRANCH: ${{ inputs.min_branch }}
          CONDITION: ${{ inputs.min_condition }}
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
        run: |
          set -euo pipefail
          case "$LEVEL" in
            standard) d=(15 80 7 0 0 off 60) ;;
            high)     d=(15 60 6 85 75 report 120) ;;
            safety)   d=(10 60 6 100 100 100 600) ;;
            *) echo "::error::level must be standard, high or safety, not '$LEVEL'"; exit 1 ;;
          esac
          {
            echo "ccn=${CCN:-${d[0]}}"
            echo "length=${LENGTH:-${d[1]}}"
            echo "params=${PARAMS:-${d[2]}}"
            echo "line=${LINE:-${d[3]}}"
            echo "branch=${BRANCH:-${d[4]}}"
            echo "condition=${CONDITION:-${d[5]}}"
            echo "fuzz_seconds=${FUZZ_SECONDS:-${d[6]}}"
          } | tee -a "$GITHUB_OUTPUT"
      # The sanitizers need no limits, so the checkout runs even when the level is invalid.
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        id: checkout
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false

      # --- complexity ------------------------------------------------------------------------------------------
      - &lizard-install
        name: Install lizard (pinned, hash-checked)
        id: lizard_install
        if: ${{ !cancelled() && inputs.run_complexity && steps.l.outcome == 'success' && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/req-lizard.txt" <<'REQ'
          lizard==1.24.1 --hash=sha256:746060a3e9a375af7340b2d4c6aab307b8a8b4199339c36ddc7afc4188b53d1c
          pathspec==1.1.1 --hash=sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
          Pygments==2.21.0 --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9
          REQ
          python3 -m venv "$RUNNER_TEMP/q-lizard"
          "$RUNNER_TEMP/q-lizard/bin/pip" install --disable-pip-version-check --require-hashes --no-deps \
            -r "$RUNNER_TEMP/req-lizard.txt"
      - &lizard
        name: Measure (modified cyclomatic complexity, length, parameters)
        id: lizard
        if: ${{ !cancelled() && steps.lizard_install.outcome == 'success' }}
        env:
          PATHS: ${{ inputs.library_paths }}
          CCN: ${{ steps.l.outputs.ccn }}
          LENGTH: ${{ steps.l.outputs.length }}
          PARAMS: ${{ steps.l.outputs.params }}
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -uo pipefail
          read -r -a paths <<< "$PATHS"
          existing=()
          for p in "${paths[@]}"; do if [ -e "$p" ]; then existing+=("$p"); fi; done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "::error::none of the library_paths exist: $PATHS"
            exit 1
          fi
          # lizard picks files in a directory by extension and skips header-only implementation files
          # (.ipp, .tpp, .inl), so list every C/C++ file explicitly; a file named in library_paths is
          # measured whatever its extension.
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find "${existing[@]}" -type f \( \
            -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.h' -o -name '*.hh' \
            -o -name '*.hpp' -o -name '*.hxx' -o -name '*.ipp' -o -name '*.tpp' -o -name '*.inl' \) -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no C or C++ files under library_paths: $PATHS"
            exit 1
          fi
          echo "measuring ${#files[@]} file(s)"
          # -m: modified CCN (a switch counts once); -w: one line per function over a limit.
          # lizard exits 1 when a function is over a limit; the count below decides (run: steps use bash -e).
          "$RUNNER_TEMP/q-lizard/bin/lizard" -l cpp -l c -m -w -C "$CCN" -L "$LENGTH" -a "$PARAMS" "${files[@]}" \
            > "$RUNNER_TEMP/over.txt" || true
          "$RUNNER_TEMP/q-lizard/bin/lizard" -l cpp -l c -m "${files[@]}" > "$RUNNER_TEMP/complexity.txt" || true
          n=$(grep -c ': warning: ' "$RUNNER_TEMP/over.txt" || true)
          echo "findings=$n" >> "$GITHUB_OUTPUT"
          mkdir -p reports/complexity && cp "$RUNNER_TEMP/complexity.txt" "$RUNNER_TEMP/over.txt" reports/complexity/
          {
            echo "### Complexity (limits: CCN $CCN, $LENGTH lines, $PARAMS parameters)"
            echo
            if [ "$n" -eq 0 ]; then echo "No function over a limit."; else echo '```'; cat "$RUNNER_TEMP/over.txt"; echo '```'; fi
            echo
            echo '```'
            tail -n 4 "$RUNNER_TEMP/complexity.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed -E 's#^([^:]+):([0-9]+): warning: (.*)$#::error file=\1,line=\2::\3#' "$RUNNER_TEMP/over.txt"
          if [ "$n" -gt 0 ] && [ "$ENFORCE" = "true" ]; then
            echo "::error::$n function(s) over the limits of the ${{ inputs.level }} level (a deviation record covers a justified one)"
            exit 1
          fi
          exit 0
      - &lizard-upload
        name: Upload the complexity report
        if: ${{ always() && inputs.run_complexity && steps.l.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}-complexity
          path: reports/complexity/
          if-no-files-found: ignore
          retention-days: 30

      # --- coverage --------------------------------------------------------------------------------------------
      - &gcovr-install
        name: Install GCC 14 and gcovr (pinned, hash-checked)
        id: gcovr_install
        if: ${{ !cancelled() && inputs.run_coverage && steps.l.outcome == 'success' && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-timeouts >/dev/null
            if sudo timeout 180 apt-get update -q && sudo timeout 600 apt-get install -y -q --no-install-recommends gcc-14 g++-14 cmake ninja-build; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo "::error::apt-get install failed"; exit 1; fi
            sleep $((attempt * 15))
          done
          cat > "$RUNNER_TEMP/req-gcovr.txt" <<'REQ'
          gcovr==8.7 --hash=sha256:2a68612c5981c388537f2e236c231a5d788b8bd9e406d13ced662c97b17e9784
          Pygments==2.21.0 --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9
          colorlog==6.12.0 --hash=sha256:30d392604e9110045a2c2aeefc27d7a017abbab63f3a8aee594eac0801df784e
          Jinja2==3.1.6 --hash=sha256:85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
          MarkupSafe==3.0.4 --hash=sha256:8e124f974786f831d6043728e38296969d3579db8896fe004682f5758e613581
          lxml==6.1.3 --hash=sha256:909f4e927bb051f7740d6367285fc60cdcfdaf0258c2dba4ff5ba7eadadc250c
          REQ
          python3 -m venv "$RUNNER_TEMP/q-gcovr"
          "$RUNNER_TEMP/q-gcovr/bin/pip" install --disable-pip-version-check --require-hashes --no-deps \
            -r "$RUNNER_TEMP/req-gcovr.txt"
          g++-14 --version | head -1
      - &gcovr-build
        name: Configure and build with coverage
        id: gcovr_build
        if: ${{ !cancelled() && steps.gcovr_install.outcome == 'success' }}
        env:
          SOURCE_DIR: ${{ inputs.source_dir }}
          CMAKE_ARGS: ${{ inputs.cmake_args }}
          CONDITION: ${{ steps.l.outputs.condition }}
        run: |
          set -euo pipefail
          read -r -a extra <<< "$CMAKE_ARGS"
          flags="--coverage -O0 -g"
          # MC/DC: GCC 14 records whether each condition independently decided its outcome.
          if [ "$CONDITION" != "off" ]; then flags="$flags -fcondition-coverage"; fi
          cmake -S "$SOURCE_DIR" -B build-coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" "${extra[@]}"
          cmake --build build-coverage --parallel
      - &gcovr-test
        name: Test
        id: gcovr_test
        if: ${{ !cancelled() && steps.gcovr_build.outcome == 'success' }}
        env:
          CTEST_ARGS: ${{ inputs.ctest_args }}
        run: |
          set -euo pipefail
          read -r -a extra <<< "$CTEST_ARGS"
          ctest --test-dir build-coverage --output-on-failure --parallel "$(nproc)" "${extra[@]}"
      - &gcovr
        name: Measure (library code, test binaries that ran)
        id: gcovr
        if: ${{ !cancelled() && steps.gcovr_test.outcome == 'success' }}
        env:
          PATHS: ${{ inputs.library_paths }}
          LINE: ${{ steps.l.outputs.line }}
          BRANCH: ${{ steps.l.outputs.branch }}
          CONDITION: ${{ steps.l.outputs.condition }}
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -uo pipefail
          read -r -a paths <<< "$PATHS"
          filters=()
          esc() { printf '%s' "$1" | sed 's/[.[\*^$+?(){}|]/\\&/g'; }
          for p in "${paths[@]}"; do
            if [ -f "$p" ]; then filters+=(--filter "^$(esc "$p")\$"); else filters+=(--filter "^$(esc "${p%/}")/"); fi
          done
          # Only objects of binaries that ran: a compile-only target has notes but no data and would count as 0%.
          mapfile -t dirs < <(find build-coverage -name '*.gcda' -printf '%h\n' | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::no coverage data: did any test run?"
            exit 1
          fi
          out=reports/coverage
          mkdir -p "$out"
          # --merge-lines: a header-only driver is a template, compiled once per port type a test binary uses.
          # Coverage is of the source: a line, branch or condition counts as covered when any instance ran it.
          args=(--root . --gcov-executable gcov-14 "${filters[@]}" --exclude-unreachable-branches
                --exclude-throw-branches --merge-lines --json-summary "$out/coverage-summary.json"
                --cobertura "$out/coverage.xml" --html-details "$out/coverage.html" --txt "$out/coverage.txt")
          "$RUNNER_TEMP/q-gcovr/bin/gcovr" "${args[@]}" "${dirs[@]}"
          read -r line branch condition < <(python3 - <<'PY'
          import json
          s = json.load(open("reports/coverage/coverage-summary.json"))
          def pct(k):
              v = s.get(k)
              return "" if v is None else f"{float(v):.1f}"
          print(pct("line_percent") or "0", pct("branch_percent") or "0", pct("condition_percent") or "-")
          PY
          )
          if [ "$condition" = "-" ]; then condition=""; fi
          { echo "line=$line"; echo "branch=$branch"; echo "condition=$condition"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Coverage of library code (${{ inputs.level }} level)"
            echo
            echo "| Metric | Measured | Floor |"
            echo "| --- | --- | --- |"
            echo "| Lines | ${line}% | ${LINE}% |"
            echo "| Branches | ${branch}% | ${BRANCH}% |"
            if [ "$CONDITION" != "off" ]; then echo "| MC/DC (conditions) | ${condition:-n/a}% | ${CONDITION} |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          below() { python3 -c "import sys; sys.exit(0 if float('$1' or 0) < float('$2') else 1)"; }
          if below "$line" "$LINE"; then echo "::error::line coverage ${line}% is below ${LINE}%"; fail=1; fi
          if below "$branch" "$BRANCH"; then echo "::error::branch coverage ${branch}% is below ${BRANCH}%"; fail=1; fi
          if [[ "$CONDITION" =~ ^[0-9]+$ ]] && below "$condition" "$CONDITION"; then
            echo "::error::MC/DC coverage ${condition:-0}% is below ${CONDITION}%"; fail=1
          fi
          if [ "$fail" -eq 1 ] && [ "$ENFORCE" = "true" ]; then exit 1; fi
          exit 0
      - &gcovr-upload
        name: Upload the coverage report
        if: ${{ always() && inputs.run_coverage && steps.l.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}-coverage
          path: reports/coverage/
          if-no-files-found: ignore
          retention-days: 30

      # --- sanitizers ------------------------------------------------------------------------------------------
      - &san-install
        name: Install clang
        id: san_install
        if: ${{ !cancelled() && inputs.run_sanitizers && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-timeouts >/dev/null
            if sudo timeout 180 apt-get update -q && sudo timeout 600 apt-get install -y -q --no-install-recommends clang cmake ninja-build; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo "::error::apt-get install failed"; exit 1; fi
            sleep $((attempt * 15))
          done
          clang++ --version | head -1
      - &san-build
        name: Configure and build with AddressSanitizer and UndefinedBehaviorSanitizer
        id: san_build
        if: ${{ !cancelled() && steps.san_install.outcome == 'success' }}
        env:
          SOURCE_DIR: ${{ inputs.source_dir }}
          CMAKE_ARGS: ${{ inputs.cmake_args }}
        run: |
          set -euo pipefail
          read -r -a extra <<< "$CMAKE_ARGS"
          # Any report is fatal (no recover); the frame pointer gives readable stacks.
          flags="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -O1 -g"
          cmake -S "$SOURCE_DIR" -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" "${extra[@]}"
          cmake --build build-sanitizers --parallel
      - &san-test
        name: Test under the sanitizers
        if: ${{ !cancelled() && steps.san_build.outcome == 'success' }}
        env:
          CTEST_ARGS: ${{ inputs.ctest_args }}
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          set -euo pipefail
          read -r -a extra <<< "$CTEST_ARGS"
          ctest --test-dir build-sanitizers --output-on-failure --parallel "$(nproc)" "${extra[@]}"

  # separate_jobs: true, one job per check as before 1.11.0. The steps are the ones above (YAML aliases).
  complexity:
    name: complexity (lizard)
    if: ${{ inputs.separate_jobs && inputs.run_complexity }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.lizard.outputs.findings }}
    steps:
      - *limits
      - *checkout
      - *lizard-install
      - *lizard
      - *lizard-upload

  coverage:
    name: coverage (GCC, gcovr)
    if: ${{ inputs.separate_jobs && inputs.run_coverage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      line: ${{ steps.gcovr.outputs.line }}
      branch: ${{ steps.gcovr.outputs.branch }}
      condition: ${{ steps.gcovr.outputs.condition }}
    steps:
      - *limits
      - *checkout
      - *gcovr-install
      - *gcovr-build
      - *gcovr-test
      - *gcovr
      - *gcovr-upload

  sanitizers:
    name: sanitizers (ASan, UBSan)
    if: ${{ inputs.separate_jobs && inputs.run_sanitizers }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - *checkout
      - *san-install
      - *san-build
      - *san-test

  # Fuzzing is long (60 to 600 s per target), so it stays a job of its own, in parallel with the others.
  fuzz:
    name: fuzz (libFuzzer, ASan, UBSan)
    if: ${{ inputs.fuzz_cmake_args != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - *limits
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install clang 18 and libFuzzer
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-timeouts >/dev/null
            if sudo timeout 180 apt-get update -q &&
              sudo timeout 600 apt-get install -y -q --no-install-recommends clang-18 libclang-rt-18-dev cmake ninja-build; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo "::error::apt-get install failed"; exit 1; fi
            sleep 10
          done
          clang++-18 --version | head -1
      - name: Build the fuzz targets
        env:
          SOURCE_DIR: ${{ inputs.source_dir }}
          CMAKE_ARGS: ${{ inputs.cmake_args }} ${{ inputs.fuzz_cmake_args }}
        run: |
          set -euo pipefail
          read -r -a extra <<< "$CMAKE_ARGS"
          cmake -S "$SOURCE_DIR" -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 "${extra[@]}"
          cmake --build build-fuzz --parallel
          find build-fuzz -type f -perm -u+x -name 'fuzz_*' ! -name 'fuzz_replay_*' | sort > fuzz-targets.txt
          if [ ! -s fuzz-targets.txt ]; then
            echo "::error::fuzz_cmake_args is set but the build has no fuzz_<name> executable"; exit 1
          fi
          cat fuzz-targets.txt
      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.repository }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ github.repository }}-
      - name: Fuzz
        env:
          SOURCE_DIR: ${{ inputs.source_dir }}
          SECONDS_PER_TARGET: ${{ steps.l.outputs.fuzz_seconds }}
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          set -euo pipefail
          mkdir -p fuzz-crashes
          status=0
          {
            echo "### Fuzzing, ${SECONDS_PER_TARGET} s per target (${{ inputs.level }} level)"
            echo
            echo "| Target | Runs | Coverage edges | Corpus | Result |"
            echo "| --- | ---: | ---: | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r bin; do
            name=$(basename "$bin")
            corpus="fuzz-corpus/$name"
            mkdir -p "$corpus"
            seeds="$SOURCE_DIR/tests/fuzz/corpus/$name"
            [ -d "$seeds" ] || seeds=""
            log="fuzz-crashes/$name.log"
            result=pass
            if ! "$bin" -max_total_time="$SECONDS_PER_TARGET" -print_final_stats=1 -artifact_prefix="fuzz-crashes/$name-" \
                "$corpus" ${seeds:+"$seeds"} > "$log" 2>&1; then
              result="**fail**"
              status=1
              echo "::error::$name found a failing input: see the fuzz-crashes artifact"
              tail -n 40 "$log"
            fi
            runs=$(sed -n 's/^stat::number_of_executed_units: *//p' "$log" | tail -1)
            edges=$(grep -o 'cov: [0-9]*' "$log" | tail -1 | cut -d' ' -f2)
            echo "| \`$name\` | ${runs:-?} | ${edges:-?} | $(find "$corpus" -type f | wc -l) | $result |" >> "$GITHUB_STEP_SUMMARY"
          done < fuzz-targets.txt
          if [ "$status" -ne 0 ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Add each crash input to tests/fuzz/corpus/<target>/ with the fix, so it replays as a CTest." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}-fuzz-crashes
          path: fuzz-crashes/
          retention-days: 30
