---
name: 🔍 C++ Analysis CI

on:
  push:
    branches: [main, 'release/*']  # Run on main and release branches
    tags: ['v*']  # Run on version tags
  pull_request:
    branches: [main]  # Only run on PRs targeting main branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cpp-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cppcheck:
    name: Test C++ Static Analysis (Cppcheck)
    uses: ./.github/workflows/ru-cpp-analysis.yml
    with:
      # =============================================================================
      # Analysis Paths
      # =============================================================================
      # Analyze the sample C++ code in cpp-ci-test directory
      paths: "cpp-ci-test/src cpp-ci-test/include"

      # =============================================================================
      # C++ Standard
      # =============================================================================
      std: "c++20"

      # =============================================================================
      # Quality Control
      # =============================================================================
      # Set to false to allow the workflow to complete even if issues are found
      # This is for testing the tooling, not enforcing code quality
      strict: false

  # Negative test: an out-of-bounds read must be found, and strict mode must then fail.
  finds-issues:
    name: Cppcheck reports a known-bad file
    uses: ./.github/workflows/ru-cpp-analysis.yml
    with:
      paths: "tests/fixtures/cpp-findings"
      strict: false
      artifact_name: cppcheck-report-negative

  finds-issues-check:
    name: Cppcheck findings were counted
    needs: finds-issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expect findings
        env:
          FINDINGS: ${{ needs.finds-issues.outputs.findings }}
        run: |
          echo "findings=${FINDINGS}"
          test "${FINDINGS:-0}" -gt 0
