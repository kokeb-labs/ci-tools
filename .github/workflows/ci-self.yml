---
# Self-CI for the workflow sources in this repository. Runs on every pull
# request (any base branch, so stacked PRs are checked too) and on main.
name: 🧪 Workflow Self-CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-self-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  actionlint:
    name: actionlint + shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pinned releases, verified against their published SHA-256, so a new
      # shellcheck or actionlint release cannot change the result on its own.
      # Kept in the Actions cache by version and hash: a GitHub release outage
      # (HTTP 5xx) no longer fails the job once the binaries are cached, and a
      # download retries on every error.
      - name: Restore pinned shellcheck and actionlint
        id: lint_bins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/kokeb-tools/lint-bin
          key: lint-bin-${{ runner.os }}-sc${{ env.SHELLCHECK_VERSION }}-${{ env.SHELLCHECK_SHA256 }}-al${{ env.ACTIONLINT_VERSION }}-${{ env.ACTIONLINT_SHA256 }}

      - name: Install pinned shellcheck and actionlint
        env:
          CACHED: ${{ steps.lint_bins.outputs.cache-hit }}
        run: |
          set -euo pipefail
          bin="$HOME/.cache/kokeb-tools/lint-bin"
          if [ "${CACHED}" != "true" ] || [ ! -x "$bin/shellcheck" ] || [ ! -x "$bin/actionlint" ]; then
            mkdir -p "$bin"
            cd "$RUNNER_TEMP"
            fetch() { curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 20 -o "$1" "$2"; }

            sc="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
            fetch "${sc}" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc}"
            echo "${SHELLCHECK_SHA256}  ${sc}" | sha256sum -c -
            tar -xJf "${sc}"
            install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$bin/shellcheck"

            al="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
            fetch "${al}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al}"
            echo "${ACTIONLINT_SHA256}  ${al}" | sha256sum -c -
            tar -xzf "${al}" actionlint
            install -m 0755 actionlint "$bin/actionlint"
          fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: Run actionlint (fails on any finding, shellcheck included)
        run: |
          shellcheck --version | head -2
          actionlint -version | head -1
          actionlint -color -shellcheck="$(command -v shellcheck)"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # actionlint covers workflows only; the composite action's bash steps
      # are checked with the same pinned shellcheck here.
      - name: shellcheck the composite actions
        run: |
          python -m pip install --quiet 'PyYAML==6.0.2'
          python .github/scripts/shellcheck_actions.py .github/actions/*/action.yml

  workflow-checks:
    name: workflow contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet 'PyYAML==6.0.2'

      - name: Workflows start only from allowed triggers (docs/triggers.md)
        run: python .github/scripts/check_triggers.py .github/workflows/*.yml templates/*/.github/workflows/*.yml

      - name: No run block ends with a bare `cond && cmd`
        run: python .github/scripts/check_run_tails.py .github/workflows/*.yml .github/actions/*/action.yml

      - name: Job permissions match the README permissions table
        run: python .github/scripts/check_permissions.py

      - name: README inputs tables match the workflows
        run: python .github/scripts/gen_readme_inputs.py --check

      # ru-repo-checks runs the single checks' scripts and pinned actions as steps; the copies must not drift apart.
      - name: ru-repo-checks' steps match the single-check workflows
        run: python .github/scripts/check_repo_checks.py

      # The DCO script runs in the runner's Node against a fake GitHub API.
      - name: Unit tests for the check scripts (CI gate, DCO, organisation standard included)
        run: python .github/scripts/test_checks.py

      - name: Unit tests for the handbook checker
        run: python tools/handbook_check/test_handbook_check.py

      - name: Unit tests for the release asset script (source archive, SBOM, checksums, firmware zips)
        run: python tools/release_assets/test_release_assets.py

      # ru-build inlines the ensure-tools-directory action's script (see the
      # comment there); the two copies must not drift apart.
      - name: ru-build's inlined tools-directory step matches the action
        run: |
          python - <<'PY'
          import sys, yaml
          action = yaml.safe_load(open(".github/actions/ensure-tools-directory/action.yml"))
          build = yaml.safe_load(open(".github/workflows/ru-build.yml"))
          a = action["runs"]["steps"][0]["run"]
          b = next(s["run"] for s in build["jobs"]["generate-matrix"]["steps"] if s.get("id") == "validate")
          if a != b:
              print("::error file=.github/workflows/ru-build.yml::the 'Ensure tools directory present' script "
                    "differs from .github/actions/ensure-tools-directory/action.yml; update both")
              sys.exit(1)
          print("inlined script matches the composite action")
          PY

      # Removed inputs, new required inputs or wider permissions break every
      # caller on the current major; they need a "### Breaking" entry in
      # CHANGELOG.md (and then a major release).
      - name: No unrecorded breaking change against the base branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python .github/scripts/check_contract.py --base-ref FETCH_HEAD

      # A new [X.Y.Z] section is what release.yml tags on merge: it must be the
      # next patch, minor or major, dated, with Unreleased emptied into it.
      - name: Changelog release section
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet --tags --force origin
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python .github/scripts/changelog.py check --base-ref FETCH_HEAD

  docs-platform:
    name: docs platform (theme package, template, migration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the theme package from this commit
        run: python -m pip install ./packages/kokeb-mkdocs-theme

      # Plugin versioning switch, publish-root against a scratch remote, screenshots page selection, the root 404.
      - name: Unit tests of the theme package
        working-directory: packages/kokeb-mkdocs-theme
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          python -m unittest discover -s tests -v

      - name: Template site builds strictly, figures and generated regions current
        working-directory: templates/mkdocs-site
        run: |
          set -euo pipefail
          kokeb-docs check
          mkdocs build --strict --site-dir "$RUNNER_TEMP/template-site"

      - name: Migration of a Jekyll driver fixture
        run: |
          set -euo pipefail
          cp -R tests/fixtures/jekyll-driver "$RUNNER_TEMP/mig"
          if python tools/docs-migrate.py "$RUNNER_TEMP/mig" --check; then
            echo "::error::--check found nothing to migrate in a Jekyll fixture"
            exit 1
          fi
          python tools/docs-migrate.py "$RUNNER_TEMP/mig"
          python tools/docs-migrate.py "$RUNNER_TEMP/mig" --check
          cd "$RUNNER_TEMP/mig"
          mkdocs build --strict --site-dir "$RUNNER_TEMP/mig-site"
          if grep -rqE '^(layout|nav_order|parent):' docs README.md; then
            echo "::error::front matter left after migration"
            exit 1
          fi
          # The home page keeps Material's hide: block, the only front matter the style guide allows.
          head -4 docs/index.md | grep -qx 'hide:'
          # Doxyfile: sources only in INPUT, the main page from docs/_doxygen, case-insensitive names, final newline.
          grep -qx 'INPUT *= inc docs/_doxygen/mainpage.md' Doxyfile
          grep -qx 'USE_MDFILE_AS_MAINPAGE = docs/_doxygen/mainpage.md' Doxyfile
          grep -qx 'CASE_SENSE_NAMES *= NO' Doxyfile
          test -f docs/_doxygen/mainpage.md
          test "$(tail -c1 Doxyfile | od -An -c | tr -d ' ')" = '\n'
          if grep -q 'README' Doxyfile; then
            echo "::error::the migrated Doxyfile still reads the README"
            exit 1
          fi
          grep -qx 'name: 📚 Docs' .github/workflows/ci-docs-publish.yml

  # Dogfood the organisation checks on this repository.
  dco:
    uses: ./.github/workflows/dco.yml
    permissions:
      contents: read
      pull-requests: read

  org-standard:
    uses: ./.github/workflows/org-standard-check.yml
    permissions:
      contents: read
    with:
      extra_files: CONTRIBUTING.md

  # The self-tests of the reusable workflows: each calls one ru-*.yml on fixtures. They sit under the gate, so a red
  # reusable workflow cannot merge, and release.yml (which waits for this workflow) cannot ship it to @v1.
  selftest-host-ci:
    name: Self-test host CI
    uses: ./.github/workflows/ci-host-ci.yml
    permissions:
      contents: read

  selftest-cpp-lint:
    name: Self-test C++ lint
    uses: ./.github/workflows/ci-cpp-lint.yml
    permissions:
      contents: read
      pull-requests: write

  selftest-cpp-analysis:
    name: Self-test C++ analysis
    uses: ./.github/workflows/ci-cpp-analysis.yml
    permissions:
      contents: read

  selftest-markdown-lint:
    name: Self-test Markdown lint
    uses: ./.github/workflows/ci-markdown-lint.yml
    permissions:
      contents: read

  selftest-yaml-lint:
    name: Self-test YAML lint
    uses: ./.github/workflows/ci-yaml-lint.yml
    permissions:
      contents: read

  selftest-docs-linkcheck:
    name: Self-test docs link check
    uses: ./.github/workflows/ci-docs-linkcheck.yml
    permissions:
      contents: read

  selftest-host-quality:
    name: Self-test host quality gates
    uses: ./.github/workflows/ci-host-quality.yml
    permissions:
      contents: read

  selftest-cross-build:
    name: Self-test cross-compile
    uses: ./.github/workflows/ci-cross-build.yml
    permissions:
      contents: read

  selftest-handbook-check:
    name: Self-test handbook check
    uses: ./.github/workflows/ci-handbook-check.yml
    permissions:
      contents: read

  selftest-repo-checks:
    name: Self-test repository checks
    uses: ./.github/workflows/ci-repo-checks.yml
    permissions:
      contents: read
      pull-requests: read

  # Dogfood the gate: this repository's required check is "CI gate / gate".
  ci-gate:
    name: CI gate
    needs:
      - actionlint
      - workflow-checks
      - docs-platform
      - dco
      - org-standard
      - selftest-host-ci
      - selftest-cpp-lint
      - selftest-cpp-analysis
      - selftest-markdown-lint
      - selftest-yaml-lint
      - selftest-docs-linkcheck
      - selftest-host-quality
      - selftest-cross-build
      - selftest-handbook-check
      - selftest-repo-checks
    if: always()
    uses: ./.github/workflows/ru-ci-gate.yml
    permissions:
      contents: read
    with:
      needs_json: ${{ toJSON(needs) }}
