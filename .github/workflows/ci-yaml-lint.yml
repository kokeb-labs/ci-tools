---
name: 📝 YAML Lint CI

# Called by ci-self.yml, so the required "CI gate" covers it; runnable alone with workflow_dispatch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML Lint
    uses: ./.github/workflows/ru-yaml-lint.yml
    with:
      paths: '.github/workflows/*.yml,**/*.yml,**/*.yaml'
      config_file: '_config/.yamllint'
      strict_mode: false
      exclude_patterns: '.git/**,node_modules/**,venv/**,.venv/**,_site/**,**/espidf-tools/**'
