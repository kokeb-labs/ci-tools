---
name: 🔍 [RU] C++ Static Analysis

on:
  workflow_call:
    inputs:
      paths:
        description: "Dirs to analyze (space-separated)"
        type: string
        required: false
        default: "src inc examples"
      std:
        description: "C++ standard"
        type: string
        required: false
        default: "c++20"
      strict:
        description: "Fail the job when cppcheck reports a finding (severity other than information)"
        type: boolean
        required: false
        default: false
      exclude:
        description: "Paths to exclude (space-separated)"
        type: string
        required: false
        default: ""
      enable:
        description: >
          Checks to enable (comma-separated: all,warning,style,performance,
          portability,information,unusedFunction,missingInclude)
        type: string
        required: false
        default: "warning,style,performance,portability,information"
      force:
        description: "Force checking even with incomplete analysis"
        type: boolean
        required: false
        default: false
      max_configs:
        description: >
          Maximum configs to check (for template-heavy code, 0=unlimited)
        type: number
        required: false
        default: 0
      artifact_name:
        description: "Name of the uploaded report artifact (unique per call when a run calls this more than once)"
        type: string
        required: false
        default: "cppcheck-report"
    outputs:
      findings:
        description: "Number of cppcheck findings (severity other than information)"
        value: ${{ jobs.cppcheck.outputs.findings }}

permissions: {}

jobs:
  cppcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.run.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # cppcheck from Ubuntu's archive (signed, versioned with the runner image), not a third-party container.
      - name: Install cppcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cppcheck
          cppcheck --version

      - name: Run cppcheck
        id: run
        shell: bash
        env:
          CPPCHECK_PATHS: ${{ inputs.paths }}
          CPPCHECK_EXCLUDE: ${{ inputs.exclude }}
          CPPCHECK_ENABLE: ${{ inputs.enable }}
          CPPCHECK_FORCE: ${{ inputs.force }}
          CPPCHECK_MAX_CONFIGS: ${{ inputs.max_configs }}
          CPPCHECK_STD: ${{ inputs.std }}
        run: |
          set -euo pipefail

          # Suppress missingIncludeSystem (system headers are not analysed) and
          # unmatchedSuppression (inline suppressions that match nothing).
          args=(
            "--enable=${CPPCHECK_ENABLE}"
            --suppress=missingIncludeSystem
            --suppress=unmatchedSuppression
            --inline-suppr
            "--std=${CPPCHECK_STD}"
          )
          if [ "${CPPCHECK_FORCE}" = "true" ]; then
            args+=(--force)
          fi
          if [ -n "${CPPCHECK_MAX_CONFIGS}" ] && [ "${CPPCHECK_MAX_CONFIGS}" != "0" ]; then
            args+=("--max-configs=${CPPCHECK_MAX_CONFIGS}")
          fi
          args+=(--xml --output-file=cppcheck_report.xml)

          # cppcheck ignores paths with -i (there is no --exclude).
          read -r -a excludes <<< "${CPPCHECK_EXCLUDE}"
          for ex in "${excludes[@]}"; do
            args+=(-i "${ex}")
          done
          read -r -a paths <<< "${CPPCHECK_PATHS}"
          for p in "${paths[@]}"; do
            if [ -e "$p" ]; then args+=("$p"); else echo "::warning::cppcheck path '$p' does not exist"; fi
          done

          # A non-zero exit here is cppcheck itself failing (bad arguments, crash), not a finding.
          cppcheck "${args[@]}" 2>&1 | tee cppcheck_output.txt

          # Findings are the <error> elements, except the informational ones (checker reports, include notes).
          findings="$(python3 -c 'import sys, xml.etree.ElementTree as ET
          errs = ET.parse(sys.argv[1]).getroot().iter("error")
          print(sum(1 for e in errs if e.get("severity") != "information"))' cppcheck_report.xml)"
          echo "findings=$findings" >> "$GITHUB_OUTPUT"
          echo "cppcheck findings: $findings" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            cppcheck_report.xml
            cppcheck_output.txt
          retention-days: 14

      - name: Fail on findings (strict)
        if: ${{ inputs.strict && steps.run.outputs.findings != '0' }}
        env:
          FINDINGS: ${{ steps.run.outputs.findings }}
        run: |
          echo "::error::cppcheck reported ${FINDINGS} finding(s) (strict); see the report artifact"
          exit 1
