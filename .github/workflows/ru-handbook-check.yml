---
# Check the repository against the Kokeb Labs handbook rules a script can decide: the `.kokeb/handbook.yml`
# declaration and its waivers, the root layout, `driver.yml`, C++20 and no file(GLOB) in CMake, no heap,
# exceptions, RTTI or virtual functions in driver code, the target library subset of headers, and no committed
# sdkconfig or datasheet. Each finding names its rule and links to it; a rule still in its warning period warns,
# a waived rule is a notice. The checker comes from this workflow's own commit of kokeb-labs/ci-tools.
name: 📘 [RU] Handbook check

on:
  workflow_call:
    inputs:
      path:
        description: "Directory of the repository to check, relative to the checkout root"
        type: string
        required: false
        default: "."
      enforce:
        description: "Fail the job on an error. False reports only (the counts are in the outputs)."
        type: boolean
        required: false
        default: true
    outputs:
      errors:
        description: "Number of findings that fail the check"
        value: ${{ jobs.check.outputs.errors }}
      warnings:
        description: "Number of findings in a rule's warning period, or of a should rule"
        value: ${{ jobs.check.outputs.warnings }}

permissions: {}

jobs:
  check:
    name: handbook rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      errors: ${{ steps.check.outputs.errors }}
      warnings: ${{ steps.check.outputs.warnings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The checker and its rules snapshot at the commit of this workflow, so @v1 callers get the matching pair.
      # Trust: this is kokeb-labs/ci-tools' own code at the commit the caller pinned (the same trust as this
      # workflow file). The job has contents: read only, no secrets and no cache, so nothing it runs can write
      # to the caller's repository, its caches or its releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository || 'kokeb-labs/ci-tools' }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || 'v1' }}
          path: .handbook-check
          sparse-checkout: tools/handbook_check
          persist-credentials: false
      - name: Install PyYAML (pinned, hash-checked)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/req.txt" <<'REQ'
          PyYAML==6.0.3 \
            --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc \
            --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6 \
            --hash=sha256:c458b6d084f9b935061bc36216e8a69a7e293a2f1e68bf956dcd9e6cbcd143f5
          REQ
          python3 -m venv "$RUNNER_TEMP/h"
          "$RUNNER_TEMP/h/bin/pip" install --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/req.txt"
      - name: Check
        id: check
        env:
          ENFORCE: ${{ inputs.enforce }}
          CHECK_PATH: ${{ inputs.path }}
        run: |
          set -uo pipefail
          set +e  # run: steps use bash -e; the checker's status is decided below
          "$RUNNER_TEMP/h/bin/python" .handbook-check/tools/handbook_check/handbook_check.py --repo "$CHECK_PATH" \
            --report "$RUNNER_TEMP/handbook-report.json"
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then exit 1; fi
          if [ "$status" -ne 0 ] && [ "$ENFORCE" = "true" ]; then exit 1; fi
          exit 0
