---
# Configure, build and test a matrix of CMake configurations (docs/ru-cmake-matrix.md): MCU x RTOS x preset, entries
# given as JSON, or the MCU/RTOS pairs of a compatibility catalogue. Host entries build with the GCC or Clang of
# tools/misra/toolchain.json and run ctest (JUnit in the artifact); Arm entries build with the pinned, hash-checked
# Arm GNU toolchain of the same file; esp-idf entries build in the ESP-IDF v5.5 container, pinned by digest, with
# its toolchain file. At most max_parallel jobs run at once and each builds with build_parallel jobs, so a large
# matrix does not starve the runners. Compiler diagnostics become annotations; one table in the run summary.
name: 🧮 [RU] CMake matrix

on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          JSON list of entries. Keys: name (required, unique), toolchain (host-gcc, host-clang, arm-none-eabi,
          esp-idf), core (arm-none-eabi), idf_target (esp-idf), mcu, rtos, preset, cmake_args, source_dir, target,
          build_type, test, consumer_args
        type: string
        required: false
        default: ""
      matrix_from:
        description: >-
          A compatibility catalogue (compat.yml, schema 1, as ru-catalog writes it): every distinct mcu and rtos
          of its drivers' configs becomes an entry, added to matrix
        type: string
        required: false
        default: ""
      mcus:
        description: "Space-separated MCUs; with rtoses and presets their cross product is added to matrix"
        type: string
        required: false
        default: ""
      rtoses:
        description: "Space-separated RTOSes of the cross product"
        type: string
        required: false
        default: ""
      presets:
        description: "Space-separated CMake configure presets of the cross product (CMakePresets.json)"
        type: string
        required: false
        default: ""
      mcu_toolchains:
        description: >-
          JSON object: MCU name pattern (fnmatch, case-insensitive, first match wins) -> toolchain, toolchain:core
          or esp-idf:target, for entries that name an MCU but no toolchain
        type: string
        required: false
        default: >-
          {"HOST": "host-gcc", "ESP32S3*": "esp-idf:esp32s3", "ESP32C3*": "esp-idf:esp32c3",
          "ESP32C6*": "esp-idf:esp32c6", "ESP32*": "esp-idf:esp32", "STM32F0*": "arm-none-eabi:cortex-m0plus",
          "STM32G0*": "arm-none-eabi:cortex-m0plus", "STM32F1*": "arm-none-eabi:cortex-m3",
          "STM32F7*": "arm-none-eabi:cortex-m7f", "STM32H7*": "arm-none-eabi:cortex-m7f",
          "STM32H5*": "arm-none-eabi:cortex-m33f", "STM32U5*": "arm-none-eabi:cortex-m33f",
          "STM32*": "arm-none-eabi:cortex-m4f"}
      mcu_variable:
        description: "CMake cache variable an entry's mcu is passed as (-D<variable>=<mcu>); empty passes none"
        type: string
        required: false
        default: "KB_MCU"
      rtos_variable:
        description: "CMake cache variable an entry's rtos is passed as; empty passes none"
        type: string
        required: false
        default: "KB_RTOS"
      toolchain:
        description: "Toolchain of an entry that names none and whose MCU matches no mcu_toolchains pattern"
        type: string
        required: false
        default: "host-gcc"
      source_dir:
        description: "CMake source directory of an entry that names none, relative to the repository root"
        type: string
        required: false
        default: "."
      cmake_args:
        description: "Configure arguments added to every entry, after the entry's own"
        type: string
        required: false
        default: ""
      build_type:
        description: "CMAKE_BUILD_TYPE of an entry without a preset or build_type"
        type: string
        required: false
        default: "Debug"
      build_target:
        description: "Target of an entry that names none; empty builds all"
        type: string
        required: false
        default: ""
      run_tests:
        description: "Run ctest for host entries that do not set test"
        type: boolean
        required: false
        default: true
      no_tests:
        description: "What a tested entry with no tests is: error (default) or ignore"
        type: string
        required: false
        default: "error"
      ctest_args:
        description: "Extra ctest arguments, e.g. -L unit"
        type: string
        required: false
        default: ""
      install_consumer:
        description: >-
          A CMake project that uses the installed package through find_package: after each host entry's tests,
          the build is installed to a staging prefix and this project is configured (with CMAKE_PREFIX_PATH and
          -DMATRIX_ENTRY=<name>), built and tested. Skipped with a warning while it has no CMakeLists.txt.
        type: string
        required: false
        default: ""
      submodules:
        description: "actions/checkout submodules value: false, true or recursive"
        type: string
        required: false
        default: "false"
      max_parallel:
        description: "Most configurations built at the same time (strategy.max-parallel)"
        type: string
        required: false
        default: "4"
      build_parallel:
        description: "Jobs of each cmake --build and ctest; empty uses the runner's processor count"
        type: string
        required: false
        default: ""
      ccache:
        description: "Use ccache with a per-configuration Actions cache"
        type: boolean
        required: false
        default: true
      esp_idf_image:
        description: "Container image of esp-idf entries (pin it by digest)"
        type: string
        required: false
        default: "espressif/idf:v5.5.6@sha256:bf72fe7a15c22849a9a94147301165a545fb8905d97c176cf748e3e4614cac84"
      timeout_minutes:
        description: "Timeout of each configuration's job, in minutes"
        type: string
        required: false
        default: "60"
      artifact_prefix:
        description: "Prefix of the per-configuration artifacts (results, JUnit); distinct per call in one run"
        type: string
        required: false
        default: "cmake-matrix"
    outputs:
      count:
        description: "Number of configurations"
        value: ${{ jobs.plan.outputs.count }}
      passed:
        description: "Configurations that passed"
        value: ${{ jobs.report.outputs.passed }}
      failed:
        description: "Configurations that failed or did not run"
        value: ${{ jobs.report.outputs.failed }}
      results:
        description: >-
          JSON list of {name, toolchain, mcu, rtos, status, failed_step, seconds, tests}; ru-catalog's results_json
          reads it
        value: ${{ jobs.report.outputs.results }}

permissions: {}

jobs:
  plan:
    name: configurations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      call_id: ${{ steps.plan.outputs.call_id }}
      count: ${{ steps.plan.outputs.count }}
      runner: ${{ steps.plan.outputs.runner }}
      runner_count: ${{ steps.plan.outputs.runner_count }}
      container: ${{ steps.plan.outputs.container }}
      container_count: ${{ steps.plan.outputs.container_count }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The scripts at the commit of this workflow (the same trust as this file).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository || 'kokeb-labs/ci-tools' }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || 'v1' }}
          path: .ru-cmake-matrix/ci-tools
          sparse-checkout: |
            tools/cmake_matrix
            tools/misra
          persist-credentials: false
      - name: Install PyYAML (pinned, hash-checked)
        if: ${{ inputs.matrix_from != '' }}
        run: python3 .ru-cmake-matrix/ci-tools/tools/misra/install.py python --venv "$RUNNER_TEMP/venv"
      - name: Plan the configurations
        id: plan
        env:
          MATRIX: ${{ inputs.matrix }}
          MATRIX_FROM: ${{ inputs.matrix_from }}
          MCUS: ${{ inputs.mcus }}
          RTOSES: ${{ inputs.rtoses }}
          PRESETS: ${{ inputs.presets }}
          MCU_TOOLCHAINS: ${{ inputs.mcu_toolchains }}
          MCU_VARIABLE: ${{ inputs.mcu_variable }}
          RTOS_VARIABLE: ${{ inputs.rtos_variable }}
          DEFAULT_TOOLCHAIN: ${{ inputs.toolchain }}
          BUILD_TYPE: ${{ inputs.build_type }}
          SOURCE_DIR: ${{ inputs.source_dir }}
          BUILD_TARGET: ${{ inputs.build_target }}
          RUN_TESTS: ${{ inputs.run_tests }}
          NO_TESTS: ${{ inputs.no_tests }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          case "$NO_TESTS" in error|ignore) ;; *) echo "::error::no_tests must be error or ignore"; exit 1 ;; esac
          for v in "$MAX_PARALLEL" "$TIMEOUT"; do
            [[ "$v" =~ ^[1-9][0-9]*$ ]] || { echo "::error::max_parallel and timeout_minutes are positive integers"; exit 1; }
          done
          py=python3
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then py="$RUNNER_TEMP/venv/bin/python"; fi
          "$py" .ru-cmake-matrix/ci-tools/tools/cmake_matrix/plan.py --out "$RUNNER_TEMP/plan.json" \
            --github-output "$GITHUB_OUTPUT"
          echo "plan=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/plan.json")" \
            >> "$GITHUB_OUTPUT"
          count=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["count"])' "$RUNNER_TEMP/plan.json")
          if [ "$count" = "0" ]; then
            echo "::notice::no configuration to build (empty matrix, matrix_from without configs, no cross product)"
          fi

  build:
    name: ${{ matrix.entry.name }}
    needs: plan
    if: ${{ needs.plan.outputs.runner_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository || 'kokeb-labs/ci-tools' }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || 'v1' }}
          path: .ru-cmake-matrix/ci-tools
          sparse-checkout: |
            tools/cmake_matrix
            tools/misra
          persist-credentials: false
      # Only the downloaded archive is cached; install.py checks it against its pinned SHA-256 on every run before
      # extracting it, so a cache entry cannot change what runs.
      - name: Restore the Arm GNU toolchain archive
        if: ${{ matrix.entry.toolchain == 'arm-none-eabi' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ru-cmake-matrix/arm
          key: ru-cmake-matrix-arm-${{ hashFiles('.ru-cmake-matrix/ci-tools/tools/misra/toolchain.json') }}
      - name: Install the toolchain (toolchain.json)
        env:
          TOOLCHAIN: ${{ matrix.entry.toolchain }}
          USE_CCACHE: ${{ inputs.ccache }}
        run: |
          set -euo pipefail
          tools=.ru-cmake-matrix/ci-tools/tools/misra
          read -r gcc clang < <(python3 -c 'import json,sys; h=json.load(open(sys.argv[1]))["host"]; print(h["gcc"], h["clang"])' "$tools/toolchain.json")
          case "$TOOLCHAIN" in
            host-gcc|host-clang)
              if ! command -v "$gcc" >/dev/null || ! command -v "$clang" >/dev/null; then python3 "$tools/install.py" apt; fi
              echo "CMAKE_MATRIX_GCC=$gcc" >> "$GITHUB_ENV"
              echo "CMAKE_MATRIX_CLANG=$clang" >> "$GITHUB_ENV"
              "$gcc" --version | sed -n 1p
              "$clang" --version | sed -n 1p ;;
            arm-none-eabi)
              python3 "$tools/install.py" arm --cache ~/.cache/ru-cmake-matrix/arm --dest "$RUNNER_TEMP/ru-cmake-matrix" \
                --github-env "$GITHUB_ENV"
              echo "$RUNNER_TEMP/ru-cmake-matrix/arm/bin" >> "$GITHUB_PATH"
              "$RUNNER_TEMP/ru-cmake-matrix/arm/bin/arm-none-eabi-g++" --version | sed -n 1p ;;
          esac
          missing=()
          command -v ninja >/dev/null || missing+=(ninja-build)
          if [ "$USE_CCACHE" = "true" ] && ! command -v ccache >/dev/null; then missing+=(ccache); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            timeout 180 sudo apt-get "${apt_opts[@]}" update -q
            timeout 600 sudo apt-get "${apt_opts[@]}" install -y -q --no-install-recommends "${missing[@]}"
          fi
          cmake --version | sed -n 1p
      - name: Restore the compiler cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ru-cmake-matrix/ccache
          key: ru-cmake-matrix-ccache-${{ matrix.entry.toolchain }}-${{ matrix.entry.name }}-${{ github.sha }}
          restore-keys: ru-cmake-matrix-ccache-${{ matrix.entry.toolchain }}-${{ matrix.entry.name }}-
      - &build-entry
        name: Configure, build and test ${{ matrix.entry.name }}
        env:
          ENTRY: ${{ toJSON(matrix.entry) }}
          OUT: .ru-cmake-matrix/out/${{ matrix.entry.name }}
          CONSUMER: ${{ inputs.install_consumer }}
          CTEST_ARGS: ${{ inputs.ctest_args }}
          EXTRA_ARGS: ${{ inputs.cmake_args }}
          NO_TESTS: ${{ inputs.no_tests }}
          PARALLEL: ${{ inputs.build_parallel }}
          USE_CCACHE: ${{ inputs.ccache }}
        run: |
          # In the ESP-IDF container: the image's entrypoint (which runs export.sh) does not run in a job container,
          # so the cross compilers and ccache are put on PATH here.
          if [ -n "${IDF_PATH:-}" ] && [ -f "$IDF_PATH/export.sh" ]; then
            set +e
            # shellcheck disable=SC1091
            . "$IDF_PATH/export.sh" >/dev/null
          fi
          set -uo pipefail
          set +e  # the result is read from run.py's status below
          ccache_flag=(--no-ccache)
          if [ "$USE_CCACHE" = "true" ] && command -v ccache >/dev/null; then
            export CCACHE_DIR="$PWD/.ru-cmake-matrix/ccache" CCACHE_MAXSIZE=500M CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=1
            ccache --zero-stats >/dev/null
            ccache_flag=()
          fi
          echo "::add-matcher::.ru-cmake-matrix/ci-tools/tools/cmake_matrix/problem-matcher.json"
          python3 .ru-cmake-matrix/ci-tools/tools/cmake_matrix/run.py --entry-json "$ENTRY" --out-dir "$OUT" \
            --parallel "$PARALLEL" --install-consumer "$CONSUMER" --ctest-args "$CTEST_ARGS" \
            --configure-args "$EXTRA_ARGS" --no-tests "$NO_TESTS" "${ccache_flag[@]}"
          status=$?
          echo "::remove-matcher owner=ru-cmake-matrix-compiler::"
          if [ "$USE_CCACHE" = "true" ] && command -v ccache >/dev/null; then ccache --show-stats | sed -n 1,12p; fi
          exit "$status"
      - &upload
        name: Upload the result and test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.plan.outputs.call_id }}-${{ matrix.entry.name }}
          path: .ru-cmake-matrix/out/${{ matrix.entry.name }}
          if-no-files-found: warn
          retention-days: 14

  # esp-idf entries: in the ESP-IDF container (IDF_PATH set, ccache and Python included), with ESP-IDF's toolchain
  # file for the entry's idf_target.
  build-esp-idf:
    name: ${{ matrix.entry.name }} (ESP-IDF)
    needs: plan
    if: ${{ needs.plan.outputs.container_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    permissions:
      contents: read
    container:
      image: ${{ inputs.esp_idf_image }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.container) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository || 'kokeb-labs/ci-tools' }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || 'v1' }}
          path: .ru-cmake-matrix/ci-tools
          sparse-checkout: tools/cmake_matrix
          persist-credentials: false
      - name: ESP-IDF version
        run: |
          echo "IDF_PATH=${IDF_PATH:?the image does not set IDF_PATH}"
          git config --global --add safe.directory "$IDF_PATH"
          # export.sh may return non-zero from a benign probe; it must not stop the step.
          set +e
          # shellcheck disable=SC1091
          . "$IDF_PATH/export.sh" >/dev/null
          set -euo pipefail
          (cd "$IDF_PATH" && git describe --tags --always 2>/dev/null) || true
          cmake --version | sed -n 1p
          ninja --version
      - name: Restore the compiler cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ru-cmake-matrix/ccache
          key: ru-cmake-matrix-ccache-esp-idf-${{ matrix.entry.name }}-${{ github.sha }}
          restore-keys: ru-cmake-matrix-ccache-esp-idf-${{ matrix.entry.name }}-
      - *build-entry
      - *upload

  report:
    name: matrix result
    needs: [plan, build, build-esp-idf]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.report.outputs.passed }}
      failed: ${{ steps.report.outputs.failed }}
      results: ${{ steps.report.outputs.results }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository || 'kokeb-labs/ci-tools' }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || 'v1' }}
          path: .ru-cmake-matrix/ci-tools
          sparse-checkout: tools/cmake_matrix
          persist-credentials: false
      - name: Download the results
        if: ${{ needs.plan.outputs.count != '0' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ${{ inputs.artifact_prefix }}-${{ needs.plan.outputs.call_id }}-*
          path: .ru-cmake-matrix/results
      - name: Result of every configuration
        id: report
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          mkdir -p .ru-cmake-matrix/results
          python3 .ru-cmake-matrix/ci-tools/tools/cmake_matrix/report.py --plan "$PLAN" \
            --results .ru-cmake-matrix/results --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
