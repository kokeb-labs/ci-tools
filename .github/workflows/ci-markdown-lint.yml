---
name: 📝 Markdown Lint CI

# Called by ci-self.yml, so the required "CI gate" covers it; runnable alone with workflow_dispatch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown Lint
    uses: ./.github/workflows/ru-markdown-lint.yml
    with:
      # =============================================================================
      # File Selection
      # =============================================================================
      globs: 'docs/** *.md **/*.md'
      exclude_patterns: '.git/**,node_modules/**,venv/**,.venv/**,_site/**,**/espidf-tools/**'

      # =============================================================================
      # Configuration
      # =============================================================================
      config_file: '_config/.markdownlint.json'

      # =============================================================================
      # Execution Options
      # =============================================================================
      # use_docker: false = Use official action (faster, recommended)
      # use_docker: true  = Use Docker container (more control, supports exclude_patterns)
      use_docker: false
      fix: false  # report every issue; a fix in the runner would hide it
      separator: ''  # Separator between glob patterns (default: space)

