---
name: 🔧 [RU] C++ Linting Tools

on:
  workflow_call:
    inputs:
      clang_version:
        description: "Clang major version of clang-format and clang-tidy (20 is the supported version)"
        type: string
        required: false
        default: "20"
      clang_format_config:
        description: "Path to clang-format configuration file"
        type: string
        required: false
        default: "_config/.clang-format"
      clang_tidy_config:
        description: "Path to clang-tidy configuration file"
        type: string
        required: false
        default: "_config/.clang-tidy"
      tidy_checks:
        description: "clang-tidy checks (comma-separated glob patterns, use - prefix to disable)"
        type: string
        required: false
      extensions:
        description: "File extensions to check (comma-separated)"
        type: string
        required: false
        default: "c,cpp,cc,cxx,h,hpp,ipp,tpp,inl"
      ignore:
        description: "Files or directories to exclude from linting (pipe-separated)"
        type: string
        required: false
        default: "build|.git"
      files_changed_only:
        description: "Only lint files that have been changed in the pull request"
        type: boolean
        required: false
        default: false
      lines_changed_only:
        description: >-
          Deprecated, ignored: whole files are always checked, which is stricter. Kept so existing callers do not
          break.
        type: boolean
        required: false
        default: false
      step_summary:
        description: "Add a summary of linting results to the workflow step summary"
        type: boolean
        required: false
        default: true
      file_annotations:
        description: "Display linting errors and warnings as file annotations in the GitHub UI"
        type: boolean
        required: false
        default: true
      thread_comments:
        description: >-
          Deprecated, ignored: findings are reported as annotations and in the run summary. Kept so existing callers
          do not break.
        type: boolean
        required: false
        default: false
      cmake_args:
        description: >-
          Arguments for a CMake configure that exports compile_commands.json for clang-tidy (for example
          "-DMYCHIP_BUILD_TESTS=ON"). Without a compile database clang-tidy cannot see the project's include
          paths and reports "file not found" for its own headers. Empty: no configure, no database.
        type: string
        required: false
        default: ""
      cmake_source_dir:
        description: "Directory with the top-level CMakeLists.txt for the cmake_args configure"
        type: string
        required: false
        default: "."
      fail_on_findings:
        description: >-
          Fail the job when clang-format or clang-tidy reports a finding. Set false to only report (the count is in
          the findings output).
        type: boolean
        required: false
        default: true
    outputs:
      findings:
        description: "Number of files with clang-format or clang-tidy findings"
        value: ${{ jobs.lint.outputs.findings }}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.lint.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.files_changed_only && 0 || 1 }}  # the base branch, to list changed files

      - name: Prepare clang configuration
        env:
          FORMAT_CONFIG: ${{ inputs.clang_format_config }}
          TIDY_CONFIG: ${{ inputs.clang_tidy_config }}
        run: |
          set -e

          if [ -n "$FORMAT_CONFIG" ]; then
            if [ -f "$FORMAT_CONFIG" ]; then
              if [ "$FORMAT_CONFIG" = ".clang-format" ]; then
                echo "✅ Using existing .clang-format in repository root"
              else
                echo "✅ Linking clang-format config from $FORMAT_CONFIG"
                ln -sf "$FORMAT_CONFIG" .clang-format
              fi
            else
              echo "⚠️  clang-format config not found at $FORMAT_CONFIG"
            fi
          fi

          if [ -n "$TIDY_CONFIG" ]; then
            if [ -f "$TIDY_CONFIG" ]; then
              if [ "$TIDY_CONFIG" = ".clang-tidy" ]; then
                echo "✅ Using existing .clang-tidy in repository root"
              else
                echo "✅ Linking clang-tidy config from $TIDY_CONFIG"
                ln -sf "$TIDY_CONFIG" .clang-tidy
              fi
            else
              echo "⚠️  clang-tidy config not found at $TIDY_CONFIG"
            fi
          fi

      # LLVM's own clang-format and clang-tidy builds, from pinned PyPI wheels checked against their SHA-256.
      # No third-party action and no install script fetched at run time.
      - name: Install clang-format and clang-tidy (pinned, hash-checked)
        env:
          CLANG_VERSION: ${{ inputs.clang_version }}
        run: |
          set -euo pipefail
          case "$CLANG_VERSION" in
            20)
              cat > "$RUNNER_TEMP/req.txt" <<'REQ'
          clang-format==20.1.8 --hash=sha256:7c6bcb7e01ba4f05a4c980fda147b330f7e4833c2aea8c92a0c2df9573ae7afe
          clang-tidy==20.1.0 --hash=sha256:e205541e350044ffe0b0d1fcaf62b9953890f8ecba31458bbcdcfe73040e58b6
          REQ
              ;;
            *) echo "::error::clang_version $CLANG_VERSION is not supported; use 20"; exit 1 ;;
          esac
          python3 -m venv "$RUNNER_TEMP/clang"
          "$RUNNER_TEMP/clang/bin/pip" install --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/req.txt"
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clang/bin/clang-format" --version
          "$RUNNER_TEMP/clang/bin/clang-tidy" --version | grep -m1 -i version

      - name: Select files
        env:
          LINT_EXTENSIONS: ${{ inputs.extensions }}
          IGNORE_RAW: ${{ inputs.ignore }}
          FILES_CHANGED_ONLY: ${{ inputs.files_changed_only }}
          LINES_CHANGED_ONLY: ${{ inputs.lines_changed_only }}
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          exts = [e.strip().lstrip(".") for e in os.environ["LINT_EXTENSIONS"].split(",") if e.strip()]
          ignore = [p.strip() for p in os.environ["IGNORE_RAW"].split("|") if p.strip()]
          ignore.append("build-clang-tidy")  # the compile-database configure's own output
          files = subprocess.run(["git", "ls-files", "--", *[f"*.{e}" for e in exts]],
                                 capture_output=True, text=True, check=True).stdout.split()
          if os.environ["FILES_CHANGED_ONLY"] == "true" and os.environ["EVENT"].startswith("pull_request"):
              base = f"origin/{os.environ['BASE_REF']}"
              changed = set(subprocess.run(["git", "diff", "--name-only", "--diff-filter=d", f"{base}...HEAD"],
                                           capture_output=True, text=True, check=True).stdout.split())
              files = [f for f in files if f in changed]
          if os.environ["LINES_CHANGED_ONLY"] == "true":
              print("::notice::lines_changed_only is deprecated and ignored: whole files are checked")
          files = [f for f in files if not any(p in f for p in ignore)]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "lint-files.txt"), "w") as fh:
              fh.write("\n".join(files) + ("\n" if files else ""))
          print(f"{len(files)} file(s) to check")
          for f in files:
              print(f"  {f}")
          PY

      # clang-tidy needs each file's compile flags (include paths, -std, defines): export them from CMake.
      - name: Configure for clang-tidy (compile_commands.json)
        if: ${{ inputs.cmake_args != '' }}
        env:
          CMAKE_ARGS: ${{ inputs.cmake_args }}
          CMAKE_SOURCE: ${{ inputs.cmake_source_dir }}
        run: |
          set -euo pipefail
          read -r -a args <<< "$CMAKE_ARGS"
          cmake -S "$CMAKE_SOURCE" -B build-clang-tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "${args[@]}"
          test -f build-clang-tidy/compile_commands.json
          echo "compile database: $(grep -c '"file"' build-clang-tidy/compile_commands.json) entries"

      - name: clang-format and clang-tidy
        id: lint
        env:
          TIDY_CHECKS: ${{ inputs.tidy_checks }}
          DATABASE: ${{ inputs.cmake_args != '' && 'build-clang-tidy' || '' }}
          ANNOTATE: ${{ inputs.file_annotations }}
          SUMMARY: ${{ inputs.step_summary }}
        run: |
          python3 - <<'PY'
          import concurrent.futures as cf, os, re, subprocess
          tmp = os.environ["RUNNER_TEMP"]
          files = [f for f in open(os.path.join(tmp, "lint-files.txt")).read().split("\n") if f]
          checks = os.environ["TIDY_CHECKS"].strip()
          run_tidy = checks != "-*"
          db = os.environ["DATABASE"]
          root = os.getcwd()
          diag = re.compile(r"^(?P<file>[^:\n]+):(?P<line>\d+):(?P<col>\d+): (?P<sev>warning|error): (?P<msg>.*?)(?: \[(?P<check>[^\]]+)\])?$")

          def rel(path):
              path = os.path.normpath(os.path.join(root, path))
              return os.path.relpath(path, root) if path.startswith(root + os.sep) else None

          def fmt(f):
              r = subprocess.run(["clang-format", "--style=file", "--dry-run", "-Werror", f], capture_output=True, text=True)
              lines = sorted({int(m.group("line")) for m in map(diag.match, r.stderr.splitlines()) if m})
              return f, lines

          # Implementation files included by a header (.ipp, .tpp, .inl) are not translation units: clang-tidy
          # sees them through the sources that include them (HeaderFilterRegex), clang-format checks them here.
          included_only = (".ipp", ".tpp", ".inl")

          def tidy(f):
              if f.endswith(included_only):
                  return f, []
              cmd = ["clang-tidy", "--quiet"]
              if checks:
                  cmd.append(f"--checks={checks}")
              cmd += (["-p", db] if db else []) + [f] + ([] if db else ["--", "-std=c++20"])
              r = subprocess.run(cmd, capture_output=True, text=True)
              out = []
              for line in (r.stdout + r.stderr).splitlines():
                  m = diag.match(line)
                  if not m:
                      continue
                  path = rel(m.group("file"))
                  check = m.group("check") or ""
                  # Compiler warnings echoed as clang-diagnostic-* are the build's business, except hard errors.
                  if path is None or (check.startswith("clang-diagnostic-") and check != "clang-diagnostic-error"):
                      continue
                  out.append((path, int(m.group("line")), m.group("sev"), m.group("msg"), check))
              return f, out

          workers = os.cpu_count() or 2
          with cf.ThreadPoolExecutor(workers) as ex:
              fmt_res = list(ex.map(fmt, files))
              tidy_res = list(ex.map(tidy, files)) if run_tidy else []

          fmt_bad = {f: lines for f, lines in fmt_res if lines}
          tidy_by_file = {}
          for _, items in tidy_res:
              for path, line, sev, msg, check in items:
                  tidy_by_file.setdefault(path, set()).add((line, sev, msg, check))
          annotate = os.environ["ANNOTATE"] == "true"
          if annotate:
              for f, lines in fmt_bad.items():
                  print(f"::error file={f},line={lines[0]}::not formatted with clang-format (lines {', '.join(map(str, lines[:20]))})")
              for f, items in sorted(tidy_by_file.items()):
                  for line, sev, msg, check in sorted(items):
                      kind = "error" if sev == "error" else "warning"
                      print(f"::{kind} file={f},line={line}::{msg} [{check}]")
          bad_files = set(fmt_bad) | set(tidy_by_file)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"findings={len(bad_files)}\nformat_findings={len(fmt_bad)}\ntidy_findings={len(tidy_by_file)}\n")
          if os.environ["SUMMARY"] == "true":
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                  fh.write("### C/C++ lint\n\n| Tool | Files checked | Files with findings |\n| --- | --- | --- |\n")
                  fh.write(f"| clang-format | {len(files)} | {len(fmt_bad)} |\n")
                  fh.write(f"| clang-tidy | {len(files) if run_tidy else 'off'} | {len(tidy_by_file) if run_tidy else '-'} |\n\n")
                  for f, items in sorted(tidy_by_file.items()):
                      for line, sev, msg, check in sorted(items)[:50]:
                          fh.write(f"- `{f}:{line}` {msg} `{check}`\n")
          print(f"clang-format: {len(fmt_bad)} file(s); clang-tidy: {len(tidy_by_file)} file(s) with findings")
          PY

      - name: Fail on findings
        if: ${{ inputs.fail_on_findings && steps.lint.outputs.findings != '0' }}
        env:
          FINDINGS: ${{ steps.lint.outputs.findings }}
        run: |
          echo "::error::$FINDINGS file(s) have clang-format or clang-tidy findings"
          exit 1
