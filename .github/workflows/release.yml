# Cuts a release of this repository's reusable workflows (see docs/VERSIONING.md):
#   main green    -> after "🧪 Workflow Self-CI" (which holds the CI gate and
#                    every self-test) succeeds for a push to main: if
#                    CHANGELOG.md's top version section ([X.Y.Z]) is not
#                    tagged yet, vX.Y.Z is tagged on that commit and
#                    released as below, with that section as the notes. A
#                    pull request asks for a release by adding the section
#                    (.github/scripts/changelog.py bump patch); the self-CI
#                    checks the step and the ### Breaking rule. No new section:
#                    no release, and the entries wait under Unreleased.
#   vX.Y.Z        -> GitHub Release (notes from the matching changelog section,
#                    else generated), and the moving major tag vX is
#                    force-updated to the same commit, if vX.Y.Z is the
#                    highest release in that major.
#   vX.Y.Z-<pre>  -> pre-release; the major tag is not moved.
name: 🏷️ Release

on:
  # Releases wait for the whole self-CI on the merged commit: a red reusable workflow never reaches @v1.
  workflow_run:
    workflows: ["🧪 Workflow Self-CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # tag, create the release and move the major tag
      actions: read  # download the tool validation report of the self-CI run that released
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Credentials stay in the checkout: this job pushes tags.
        with:
          # The commit the self-CI passed on (workflow_run), or the pushed tag.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # all tags, to find the highest release in the major

      - name: Release named in CHANGELOG.md (main green)
        id: auto
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          echo "tag=" >> "$GITHUB_OUTPUT"
          version="$(python3 .github/scripts/changelog.py release --notes "$RUNNER_TEMP/notes.md" | sed -n 's/^version=//p')"
          if [ -z "$version" ]; then
            echo "::notice::no version section in CHANGELOG.md: nothing to release"
            exit 0
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag is already released; this push adds no new version section"
            exit 0
          fi
          highest="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
            echo "::error::CHANGELOG.md names $tag, which is not above the highest release $highest"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" HEAD
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::tagged $tag (after ${highest:-none})"

      - name: Parse tag
        id: tag
        if: ${{ github.event_name == 'push' || steps.auto.outputs.tag != '' }}
        env:
          TAG: ${{ steps.auto.outputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          if [ -n "${BASH_REMATCH[4]}" ]; then prerelease=true; else prerelease=false; fi
          {
            echo "tag=$TAG"
            echo "major=$major"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG major=$major prerelease=$prerelease"

      - name: Create GitHub Release
        if: ${{ steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is"
            exit 0
          fi
          # Notes: the changelog section of this version; generated notes when there is none.
          notes="$RUNNER_TEMP/notes-$TAG.md"
          found="$(python3 .github/scripts/changelog.py release --version "${TAG#v}" --notes "$notes")"
          if [ "$found" = "version=${TAG#v}" ]; then
            args=("$TAG" --verify-tag --notes-file "$notes" --title "$TAG")
          else
            args=("$TAG" --verify-tag --generate-notes --title "$TAG")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "${args[@]}"

      # The MISRA toolchain's validation report of the self-CI run this release comes from (docs/tool-validation/
      # plan.md, "Records"): the record an auditor reads, attached to the release it validates.
      - name: Download the tool validation report
        id: validation
        if: ${{ steps.tag.outputs.tag != '' && github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tool-validation
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tool-validation

      - name: Attach the tool validation report
        if: ${{ steps.tag.outputs.tag != '' && github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DOWNLOADED: ${{ steps.validation.outcome }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tool-validation"
          if [ "$DOWNLOADED" != "success" ] || [ ! -f "$dir/validation-report.md" ]; then
            echo "::error::the self-CI run has no tool-validation artifact: the release has no validation report"
            exit 1
          fi
          cp "$dir/validation-report.md" "$RUNNER_TEMP/tool-validation-report-$TAG.md"
          cp "$dir/validation-record.json" "$RUNNER_TEMP/tool-validation-record-$TAG.json"
          gh release upload "$TAG" "$RUNNER_TEMP/tool-validation-report-$TAG.md" \
            "$RUNNER_TEMP/tool-validation-record-$TAG.json" --clobber

      - name: Move the major tag
        if: ${{ steps.tag.outputs.tag != '' && steps.tag.outputs.prerelease == 'false' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MAJOR: ${{ steps.tag.outputs.major }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          # Only the highest release of a major moves it: a patch to an older
          # minor (v1.2.5 after v1.3.0) must not pull v1 backwards.
          highest="$(git tag -l "${MAJOR}.*.*" | grep -E "^${MAJOR}\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)"
          if [ "$highest" != "$TAG" ]; then
            echo "::notice::$TAG is not the highest ${MAJOR} release ($highest); ${MAJOR} stays where it is"
            exit 0
          fi
          sha="$(git rev-parse "${TAG}^{commit}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "$MAJOR -> $TAG" "$sha"
          git push --force origin "refs/tags/${MAJOR}"
          echo "::notice::${MAJOR} now points at $TAG ($sha)"
