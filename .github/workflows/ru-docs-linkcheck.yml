---
name: 🔗 [RU] Documentation Link Check

on:
  workflow_call:
    inputs:
      checkout_recursive:
        description: 'Checkout submodules recursively (useful for projects with documentation in submodules)'
        required: false
        type: boolean
        default: false
      paths:
        description: 'Space-separated paths to check for broken links'
        required: false
        type: string
        default: 'docs/** *.md **/docs/**'
      fail_on_errors:
        description: 'Fail the workflow if broken links are found'
        required: false
        type: boolean
        default: true
      timeout:
        description: 'Timeout in seconds for each link check'
        required: false
        type: string
        default: '10'
      max_retries:
        description: 'Maximum number of retries per request'
        required: false
        type: string
        default: '3'
      retry_wait_time:
        description: 'Minimum wait time in seconds between retries'
        required: false
        type: string
        default: '1'
      exclude_private:
        description: 'Exclude private/internal links'
        required: false
        type: boolean
        default: true
      exclude_mail:
        description: 'Exclude mailto links'
        required: false
        type: boolean
        default: true
      verbose:
        description: 'Enable verbose output'
        required: false
        type: boolean
        default: false
      config_file:
        description: 'Path to lychee.toml config file (optional)'
        required: false
        type: string
        default: ''
      exclude_own_site:
        description: >-
          Skip links to this repository's own GitHub Pages site (https://<owner>.github.io/<repo>/) on pull requests,
          where the pages a change links to are not published yet, and on other events while the site's latest/
          version (the root, for <owner>.github.io) does not answer yet, as before a repository's first MkDocs publish.
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout_recursive && 'recursive' || 'false' }}
          fetch-depth: 0

      - name: Own documentation site
        id: own_site
        if: ${{ inputs.exclude_own_site }}
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          repo=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
          if [ "$repo" = "$owner.github.io" ]; then
            site="https://$owner.github.io/"
            probe="$site"
          else
            site="https://$owner.github.io/$repo/"
            probe="${site}latest/"
          fi
          pattern="^$(printf '%s' "$site" | sed 's/\./\\./g')"
          if [ "$EVENT" = pull_request ]; then
            reason="a pull request: its pages are not published yet"
          elif ! curl -fsS -o /dev/null --max-time 20 "$probe"; then
            reason="$probe does not answer yet"
          else
            reason=""
          fi
          if [ -n "$reason" ]; then
            echo "Not checking links to $site ($reason)"
            echo "args=--exclude $pattern" >> "$GITHUB_OUTPUT"
          else
            echo "Checking links to $site"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # lychee is installed here, pinned and hash-checked, and kept in the Actions cache; lychee-action downloaded
      # it from GitHub releases on every run, so a release outage (HTTP 5xx) failed the job.
      - name: Restore lychee
        id: lychee_bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/kokeb-tools/lychee-0.24.2
          key: lychee-bin-${{ runner.os }}-0.24.2-1f4e0ef7

      - name: Install lychee (pinned, hash-checked)
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          CACHED: ${{ steps.lychee_bin.outputs.cache-hit }}
        run: |
          set -euo pipefail
          dir="$HOME/.cache/kokeb-tools/lychee-${LYCHEE_VERSION}"
          if [ "${CACHED}" != "true" ] || [ ! -x "$dir/lychee" ]; then
            name="lychee-x86_64-unknown-linux-gnu"
            cd "$RUNNER_TEMP"
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 20 -o lychee.tar.gz \
              "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${name}.tar.gz"
            echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
            tar -xzf lychee.tar.gz
            mkdir -p "$dir" && install -m 0755 "${name}/lychee" "$dir/lychee"
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/lychee" --version

      - name: Link check with Lychee
        env:
          FAIL: ${{ inputs.fail_on_errors }}
          # The arguments are built from this workflow's inputs and evaluated as lychee-action did.
          LYCHEE_ARGS: >-
            ${{ inputs.config_file != '' && format('--config {0}', inputs.config_file) || '' }}
            --no-progress
            ${{ inputs.verbose && '--verbose' || '' }}
            --format detailed
            --timeout ${{ inputs.timeout }}
            --max-retries ${{ inputs.max_retries }}
            --retry-wait-time ${{ inputs.retry_wait_time }}
            ${{ inputs.exclude_private && '--exclude-all-private' || '' }}
            ${{ !inputs.exclude_mail && '--include-mail' || '' }}
            ${{ steps.own_site.outputs.args }}
            ${{ inputs.paths }}
        run: |
          set -uo pipefail
          status=0
          eval "lychee ${LYCHEE_ARGS}" 2>&1 | tee "$RUNNER_TEMP/lychee.txt" || status=$?
          { echo "## Link check"; echo; echo '```'; tail -n 200 "$RUNNER_TEMP/lychee.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$FAIL" = "true" ]; then exit "$status"; fi
          exit 0
