---
name: 🔍 C++ Lint CI

# Called by ci-self.yml, so the required "CI gate" covers it; runnable alone with workflow_dispatch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write


jobs:
  test-cpp-lint:
    name: Test C++ Linting Tools
    uses: ./.github/workflows/ru-cpp-lint.yml
    with:
      # =============================================================================
      # Clang Configuration
      # =============================================================================
      clang_version: "20"
      clang_format_config: "_config/.clang-format"
      clang_tidy_config: "_config/.clang-tidy"

      # =============================================================================
      # File Patterns
      # =============================================================================
      extensions: "c,cpp,cc,cxx,h,hpp,ipp"
      # The sample project only: the fixtures under tests/ carry deliberate findings for other self-tests.
      ignore: "build|.git|docs|_site|templates|packages|tests"
      cmake_source_dir: cpp-ci-test
      cmake_args: "-DCMAKE_BUILD_TYPE=Debug"

      # =============================================================================
      # Analysis Options
      # =============================================================================
      files_changed_only: false  # Analyze all files to test the tooling
      lines_changed_only: false  # Analyze all lines to test the tooling
      step_summary: true

      # =============================================================================
      # Quality Checks
      # =============================================================================
      # Use the configuration file for tidy checks (don't override)
      tidy_checks: ""  # Empty to use _config/.clang-tidy file

  # Negative test: a file with known formatting problems must be reported (findings > 0).
  finds-issues:
    name: Lint reports a known-bad file
    uses: ./.github/workflows/ru-cpp-lint.yml
    with:
      clang_version: "20"
      clang_format_config: "_config/.clang-format"
      clang_tidy_config: "_config/.clang-tidy"
      ignore: "build|.git|docs|_site|cpp-ci-test|templates|packages|tests/fixtures/host-ci|tests/fixtures/jekyll-driver"
      fail_on_findings: false

  finds-issues-check:
    name: Lint findings were counted
    needs: finds-issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expect findings
        env:
          FINDINGS: ${{ needs.finds-issues.outputs.findings }}
        run: |
          echo "findings=${FINDINGS}"
          test "${FINDINGS:-0}" -gt 0
