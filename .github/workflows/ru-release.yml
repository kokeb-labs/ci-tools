---
name: 📦 Reusable Release

on:
  workflow_call:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for release (defaults to github.ref_name)'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The asset script at the commit of this workflow, so @v1 callers get the matching version. Trust: this is
      # kokeb-labs/ci-tools' own code at the commit the caller pinned, the same trust as this workflow file.
      - name: Checkout the release asset script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository || 'kokeb-labs/ci-tools' }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || 'v1' }}
          path: .release-assets
          sparse-checkout: tools/release_assets
          persist-credentials: false

      # Source archive with a stable checksum, SPDX 2.3 SBOM and SHA256SUMS (tools/release_assets).
      - name: Build source archive, SBOM and checksums
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          python3 -I .release-assets/tools/release_assets/release_assets.py --tag "$TAG" --out "$RUNNER_TEMP/dist"
          {
            echo '### Release files'
            echo '```text'
            cat "$RUNNER_TEMP/dist/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Create the release: source archive, SBOM and checksums, no build artifacts
      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: ${{ runner.temp }}/dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
