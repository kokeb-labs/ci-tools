<svg xmlns="http://www.w3.org/2000/svg" width="1094" height="396" viewBox="0 0 1094 396" role="img" aria-labelledby="workflow-use-title workflow-use-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="workflow-use-title">Which repositories call which workflows</title>
<desc id="workflow-use-desc">Matrix of the reusable workflow families of ci-tools against the calling repositories: every caller uses the gate and the organisation checks, kb-core and product repositories add host CI, and espidf-tools uses only the gate, docs and organisation checks.</desc>
